name: Checks

# Reusable verification suite. Called by ci.yml (PRs + dev pushes) and by
# deploy.yml (production), so a production deploy always verifies the exact
# commit being deployed (issue #110).
#
# The e2e job only runs when called with `run_e2e: true` (deploy.yml). It's
# skipped on PRs/dev pushes to keep CI fast; production deploys still require
# it via REQ-1.

on:
    workflow_call:
        inputs:
            run_e2e:
                type: boolean
                default: false

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run cf:types
            # Formatting, linting, stylelint, fallow, typecheck, eslint,
            # migration safety (expand/contract guard).
            - run: pnpm run check:all
            - run: pnpm exec playwright install --with-deps chromium
            # Unit tests + vitest browser-mode component tests.
            - run: pnpm run test -- --coverage

    e2e:
        if: ${{ inputs.run_e2e }}
        runs-on: ubuntu-latest
        timeout-minutes: 35
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: mysecretpassword
                    POSTGRES_DB: local
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root -d local"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/local
            # CI-only secret; production uses the Cloudflare-stored secret.
            AUTH_SECRET: ci-only-e2e-secret-0000000000000000
            ORIGIN: http://localhost:5173
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            # Apply the committed migrations (production path) instead of
            # `db:push`, so e2e also fails when migrations lag behind schema.ts.
            - run: pnpm run db:migrate
            - run: pnpm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: test-results/
                  retention-days: 7

    # Stable branch-protection target. The caller job and this reusable job
    # are reported as `checks / required` on PRs and dev pushes.
    required:
        name: required
        if: ${{ always() }}
        needs: [checks, e2e]
        runs-on: ubuntu-latest
        steps:
            - name: Verify required checks
              env:
                  CHECKS_RESULT: ${{ needs.checks.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
                  RUN_E2E: ${{ inputs.run_e2e }}
              run: |
                  if [ "$CHECKS_RESULT" != "success" ]; then
                    echo "Static and unit checks ended with: $CHECKS_RESULT"
                    exit 1
                  fi
                  if [ "$RUN_E2E" = "true" ] && [ "$E2E_RESULT" != "success" ]; then
                    echo "Production E2E checks ended with: $E2E_RESULT"
                    exit 1
                  fi
