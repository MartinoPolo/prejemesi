name: Checks

# Reusable verification suite. Called by ci.yml (PRs + dev pushes) and by
# deploy.yml (production), so a production deploy always verifies the exact
# commit being deployed (issue #110).
#
# Playwright runs in two tiers (docs/TESTING.md#test-tiers):
# - `e2e` (CI tier, tests/e2e) runs when a caller passes `run_e2e: true`; both
#   callers do. The input stays (default `false`) for a fast-only caller.
#   Production deploys require e2e via REQ-1.
# - `release` (release tier, tests/release) runs when a caller passes
#   `run_release: true`; ci.yml does so only for PRs targeting `production`.
#   Its test-results/ are always uploaded for the release-check skill.

on:
    workflow_call:
        inputs:
            run_e2e:
                type: boolean
                default: false
            run_release:
                type: boolean
                default: false

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run test:scripts
            - uses: actions/cache@v4
              with:
                  path: .eslintcache
                  key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
                  restore-keys: |
                      eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
            - run: pnpm run cf:types
            # Formatting runs after generated files are prepared; independent static checks
            # then execute concurrently, with ESLint reusing its content-based cache.
            - run: pnpm run check:all

    unit_tests:
        name: unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            # Unit tests + Vitest browser-mode component tests.
            - run: pnpm exec vitest run --coverage

    e2e:
        if: ${{ inputs.run_e2e }}
        runs-on: ubuntu-latest
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        # Shared with the release job through YAML aliases.
        services: &playwright-services
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: mysecretpassword
                    POSTGRES_DB: local
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root -d local" --health-interval 5s --health-timeout 5s --health-retries 20


        env: &playwright-env
            DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/local
            DEMO_TEST_ISOLATED_DATABASE: '1'
            # CI-only secret; production uses the Cloudflare-stored secret.
            AUTH_SECRET: ci-only-e2e-secret-0000000000000000
            ORIGIN: http://localhost:5173
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/prepare-e2e
            # The demo integration suite owns a separate local database, never the seeded E2E fixture.
            - if: ${{ matrix.shard == 1 }}
              run: |
                  PGPASSWORD=mysecretpassword psql -h localhost -U root -d local -c 'CREATE DATABASE demo_verify'
                  DATABASE_URL=postgres://root:mysecretpassword@localhost:5432/demo_verify pnpm run db:migrate
            # The database-backed server suite only needs one matrix runner; the Playwright
            # suite itself is split evenly across all four isolated PostgreSQL services.
            - if: ${{ matrix.shard == 1 }}
              env:
                  DEMO_TEST_DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/demo_verify
                  DEMO_TEST_ISOLATED_DATABASE: '1'
              run: pnpm exec vitest run --project server
            - run: xvfb-run --auto-servernum pnpm run test:e2e --shard=${{ matrix.shard }}/4
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-shard-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7

    release:
        if: ${{ inputs.run_release }}
        runs-on: ubuntu-latest
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        services: *playwright-services
        env: *playwright-env
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/prepare-e2e
            # Virtual display for specs that launch their own Chromium, such as the
            # real-browser-zoom regression with its unpacked extension.
            - run: xvfb-run --auto-servernum pnpm run test:release --shard=${{ matrix.shard }}/4
            # Always uploaded (including results.json): the release-check skill reads it.
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: release-results-shard-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7

    # Stable branch-protection target. The caller job and this reusable job
    # are reported as `checks / required` on PRs and dev pushes.
    required:
        name: required
        if: ${{ always() }}
        needs: [checks, unit_tests, e2e, release]
        runs-on: ubuntu-latest
        steps:
            - name: Verify required checks
              env:
                  CHECKS_RESULT: ${{ needs.checks.result }}
                  UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
                  RUN_E2E: ${{ inputs.run_e2e }}
                  RELEASE_RESULT: ${{ needs.release.result }}
                  RUN_RELEASE: ${{ inputs.run_release }}
              run: |
                  if [ "$CHECKS_RESULT" != "success" ]; then
                    echo "Static checks ended with: $CHECKS_RESULT"
                    exit 1
                  fi
                  if [ "$UNIT_TESTS_RESULT" != "success" ]; then
                    echo "Unit and browser tests ended with: $UNIT_TESTS_RESULT"
                    exit 1
                  fi
                  if [ "$RUN_E2E" = "true" ] && [ "$E2E_RESULT" != "success" ]; then
                    echo "CI-tier E2E checks ended with: $E2E_RESULT"
                    exit 1
                  fi
                  if [ "$RUN_RELEASE" = "true" ] && [ "$RELEASE_RESULT" != "success" ]; then
                    echo "Release-tier E2E checks ended with: $RELEASE_RESULT"
                    exit 1
                  fi
