name: Deploy (production)

# Deploys the production branch to Cloudflare Workers once every gate is green. Merging
# the `dev` → `production` release PR (gated by `checks / required`) is the approval;
# there is no manual environment approval.
#   1. `verify` re-runs the reusable check suite for the exact pushed commit.
#   2. `migration-review` validates the committed migration manifest.
#   3. `deploy` builds, applies pending migrations to the production database
#      (`db:migrate:prod -- --yes`; DRIFT fails), requires EXACT (`db:verify:prod`),
#      then runs `wrangler deploy` and records the deployed commit.
# Runbook: docs/DEPLOYMENT.md.
#
# Requires the CLOUDFLARE_API_TOKEN repository secret (Cloudflare → My Profile → API
# Tokens → "Edit Cloudflare Workers" template), the CLOUDFLARE_ACCOUNT_ID repository
# variable, and the PRODUCTION_DATABASE_URL secret of the `production` environment: the
# direct (non-pooler) Neon URL matching the target pinned in scripts/migrate-prod.ts.

on:
    push:
        branches: [production]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    verify:
        uses: ./.github/workflows/checks.yml
        with:
            run_e2e: true

    migration-review:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Confirm production target
              run: |
                  if [ "$GITHUB_REF_NAME" != "production" ]; then
                    echo "Production deployments must target the production branch, not $GITHUB_REF_NAME." >&2
                    exit 1
                  fi
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Validate complete migration manifest
              run: pnpm check:migration-history
            - name: Summarize migration gate
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  {
                    echo "## Migration gate"
                    echo ""
                    echo "Target: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`"
                    echo ""
                    echo "Local manifest: \`$(pnpm --silent check:migration-history)\`"
                    echo ""
                    echo "The deploy job applies pending migrations to production and requires EXACT before \`wrangler deploy\`."
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
                    NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "${{ github.sha }}" -- 'drizzle/*.sql')
                    if [ -n "$NEW_MIGRATIONS" ]; then
                      {
                        echo "New migration files in this push:"
                        echo ""
                        echo "$NEW_MIGRATIONS" | sed 's/^/- `/;s/$/`/'
                      } >> "$GITHUB_STEP_SUMMARY"
                    else
                      echo "No new migration files in this push." >> "$GITHUB_STEP_SUMMARY"
                    fi
                  else
                    echo "Manual dispatch: no push delta is available; the deploy job reconciles the complete manifest." >> "$GITHUB_STEP_SUMMARY"
                  fi

    deploy:
        needs: [verify, migration-review]
        runs-on: ubuntu-latest
        # The `production` environment has no required reviewer, so a green run deploys
        # without a hold. It records deployment history, scopes PRODUCTION_DATABASE_URL to
        # this job, and its branch policy admits only the production branch.
        environment:
            name: production
            url: https://prejemesi.cz
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Verify Sentry production configuration
              run: |
                  for variable in PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
                    if [ -z "${!variable}" ]; then
                      echo "$variable must be configured for production monitoring." >&2
                      exit 1
                    fi
                  done
              env:
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
            - name: Build and upload Sentry source maps
              run: pnpm run build
              env:
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
                  SENTRY_RELEASE: ${{ github.sha }}
                  SENTRY_UPLOAD_SOURCE_MAPS: 'true'
            # scripts/migrate-prod.ts reads DATABASE_URL from .env.production. The file is
            # written only after the build so Vite never loads it, and removed before deploy.
            - name: Provide production database credentials
              run: |
                  if [ -z "$PRODUCTION_DATABASE_URL" ]; then
                    echo "The production environment secret PRODUCTION_DATABASE_URL is not set; refusing to migrate or deploy." >&2
                    exit 1
                  fi
                  umask 077
                  printf 'DATABASE_URL=%s\n' "$PRODUCTION_DATABASE_URL" > .env.production
              env:
                  PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
            - name: Apply pending production migrations
              run: |
                  set -o pipefail
                  migration_log="$RUNNER_TEMP/production-migrations.log"
                  migration_status=0
                  pnpm db:migrate:prod -- --yes 2>&1 | tee "$migration_log" || migration_status=$?
                  {
                    echo "## Production migrations"
                    echo ""
                    echo '```'
                    grep -E '^(Manifest:|EXACT$|PENDING:|DRIFT:)' "$migration_log" || echo "No migration state reported; see the job log."
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit "$migration_status"
            - name: Require EXACT production migration history
              run: pnpm db:verify:prod
            - name: Remove production database credentials
              if: always()
              run: rm -f .env.production
            - name: Deploy to Cloudflare Workers
              run: pnpm exec wrangler deploy --var "GIT_COMMIT_SHA:${{ github.sha }}" --var "PUBLIC_SENTRY_DSN:${PUBLIC_SENTRY_DSN}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
            - name: Record deployed commit
              run: |
                  {
                    echo "## Deployed"
                    echo ""
                    echo "- Commit: \`${{ github.sha }}\`"
                    echo "- Worker: \`prejemesi\` → https://prejemesi.cz"
                    echo "- Var: \`GIT_COMMIT_SHA=${{ github.sha }}\`"
                    echo "- Production migration history: EXACT before deploy"
                  } >> "$GITHUB_STEP_SUMMARY"
