name: Prepare Playwright E2E
description: Install dependencies and browsers, then migrate and seed the job's PostgreSQL service.

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v4
        - uses: actions/setup-node@v4
          with:
              node-version: 22
              cache: pnpm
        - shell: bash
          run: pnpm install --frozen-lockfile
        - shell: bash
          run: pnpm exec playwright install --with-deps chrome chromium
        # Apply the committed migrations (production path) instead of
        # `db:push`, so e2e also fails when migrations lag behind schema.ts.
        - shell: bash
          run: pnpm run db:migrate
        # Some specs depend on the seeded personas (e.g. admin-release-reservation.spec.ts,
        # issue #213). Seed is idempotent, so this is safe to run unconditionally.
        #
        # seed.ts is executed directly via tsx (no Vite), so it needs the generated
        # `$lib` path mapping (`svelte-kit sync`) and the compiled Paraglide runtime
        # (`paraglide:compile`, gitignored) already on disk before it runs.
        - shell: bash
          run: pnpm run paraglide:compile
        - shell: bash
          run: pnpm exec svelte-kit sync
        - shell: bash
          run: pnpm run db:seed
