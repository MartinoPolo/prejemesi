services:
    db:
        image: postgres:17
        # pg_stat_statements enables DB statement counts in load-test reports
        # (tests/load). Harmless otherwise.
        command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
        ports:
            - '${MPX_DATABASE_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: mysecretpassword
            POSTGRES_DB: local
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
