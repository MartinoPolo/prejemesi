function fieldByRef(key){const [id,itemIndex,fieldIndex]=key.split('|');const proposal=proposals[id];return {proposal,entry:proposal.items[Number(itemIndex)].fields[Number(fieldIndex)]}}
function openReview(id,{silent=false}={}){
  const proposal=proposals[id];
  ui.reviewId=id;ui.page='review';ui.menuGift=null;ui.reviewSelection={};ui.editRef=null;ui.editDraft=null;
  if(ui.viewport==='mobile')ui.open=false;
  if(silent)return;
  renderAll();$('#page-scroll').scrollTop=0;$('#review-title')?.focus();
}
function applyFromReview(){
  const proposal=proposals[ui.reviewId];
  const selectedHeld=proposal.held.map((held,index)=>({held,index})).filter(({held,index})=>held.status==='pending'&&ui.reviewSelection['h'+index]);
  const run=()=>{
    applyProposal(proposal);selectedHeld.forEach(({index})=>deleteHeld(proposal,index));
    ui.page='wishlist';ui.reviewId=null;
    if(ui.viewport==='mobile'){ui.open=true;ui.sheet='half'}
    renderAll({scroll:'bottom'});$('#page-scroll').scrollTop=0;
    toast(`Použito: ${changesOfGifts(proposal.appliedCount)}. Vrátit jde v AI asistentovi.`);$('#wishlist-title')?.focus();
  };
  if(selectedHeld.length)openDialog({title:`Smazat ${giftsLabel(selectedHeld.length)}?`,body:`Spolu se změnami se trvale odstraní: ${selectedHeld.map(({held})=>`„${escapeHtml(giftById(held.giftId).name)}“`).join(', ')}.`,confirmLabel:`Smazat ${giftsLabel(selectedHeld.length)}`,tone:'destructive',onConfirm:run});
  else run();
}
function deleteHeld(proposal,index){
  const held=proposal.held[index];
  held.removedIndex=gifts.findIndex(gift=>gift.id===held.giftId);held.removed=gifts[held.removedIndex];
  gifts=gifts.filter(gift=>gift.id!==held.giftId);deletedIds.add(held.giftId);held.status='deleted';
}
function openDialog({title,body,confirmLabel,tone,onConfirm}){
  const dialog=$('#dialog');dialog.className='';
  dialog.innerHTML=`<h2 id="dialog-title">${title}</h2><p class="dialog-text">${body}</p><div class="dialog-actions"><button type="button" class="btn secondary" data-dialog="cancel">Zrušit</button><button type="button" class="btn ${tone==='destructive'?'destructive':tone==='danger'?'danger':'primary'}" data-dialog="confirm">${tone==='destructive'?icon('trash'):tone==='danger'?icon('undo'):''}${confirmLabel}</button></div>`;
  const opener=document.activeElement;
  dialog.onclick=event=>{const button=event.target.closest('[data-dialog]');if(!button)return;dialog.close();if(button.dataset.dialog==='confirm')onConfirm();else opener?.focus?.()};
  dialog.showModal();dialog.querySelector('[data-dialog=cancel]').focus();
}
function openZoom(key,index){
  const {entry}=fieldByRef(key);const dialog=$('#dialog');dialog.className='zoom';
  const opener=document.activeElement;
  const draw=()=>{
    const candidate=entry.candidates[index];const image=IMAGES[candidate];const editing=ui.editRef===key;const chosen=editing?(ui.editDraft??entry.value)===candidate:entry.value===candidate&&entry.decision!=='rejected';
    dialog.innerHTML=`<h2 id="dialog-title">Obrázek ${index+1} ze ${entry.candidates.length} · ${image.label}</h2><div class="zoom-frame">${imageTag(candidate,'Sluchátka Sony WH-1000XM5, '+image.label)}</div>
      <p class="zoom-cap"><span>Zdroj: ${image.source}</span><span class="zoom-nav"><button type="button" class="icon-btn" aria-label="Předchozí obrázek" data-zoom="prev">${icon('chevron-left')}</button><button type="button" class="icon-btn" aria-label="Další obrázek" data-zoom="next">${icon('chevron-right')}</button></span></p>
      <div class="dialog-actions"><button type="button" class="btn secondary" data-zoom="close">Zavřít</button><button type="button" class="btn primary" data-zoom="pick" ${chosen?'disabled':''}>${chosen?icon('check')+'Vybráno':'Vybrat tento obrázek'}</button></div>`;
  };
  dialog.onclick=event=>{
    const button=event.target.closest('[data-zoom]');if(!button)return;
    const actionName=button.dataset.zoom;
    if(actionName==='prev'||actionName==='next'){index=(index+(actionName==='next'?1:-1)+entry.candidates.length)%entry.candidates.length;draw();dialog.querySelector(`[data-zoom="${actionName}"]`).focus();return}
    if(actionName==='pick'){if(ui.editRef===key)ui.editDraft=entry.candidates[index];else{entry.value=entry.candidates[index];entry.decision='accepted'}dialog.close();renderAll();announce('Obrázek vybrán.');document.querySelector(`[data-key="cand-${key}-${index}"]`)?.focus();return}
    dialog.close();opener?.focus?.();
  };
  draw();dialog.showModal();dialog.querySelector('[data-zoom="pick"]:not(:disabled),[data-zoom="close"]').focus();
}
function openPanel(){ui.open=true;renderAll({scroll:'last-user'});writeUrl();revealGhosts();$('#assistant .as-head button:not(:disabled)')?.focus()}
function closePanel(){ui.open=false;renderAll();writeUrl();(lastTrigger&&document.body.contains(lastTrigger)?lastTrigger:$('[data-key="entry"]')||$('#wishlist-title'))?.focus()}
function setMenu(giftId,{focus=false}={}){ui.menuGift=giftId;renderPage();if(focus&&giftId)$('#gift-menu .menu-item:not(:disabled)')?.focus()}
function demoChip(key){
  demoUsed.add(key);
  const labels={enrich:'Vylepšit sluchátka',create:'Přidat 3 dárky',sort:'Seřadit podle ceny'};
  thread.push(user(labels[key],'Ukázka'));
  if(key==='enrich'){const proposal=PROPOSAL_FACTORIES.enrich();proposal.inspect=true;deliverProposal(proposal);thread.push(ai(tools(['done','Heureka, Alza, Amazon.de a 3 obrázky']),text('Mám 6 vylepšení.'),proposalPart(proposal)))}
  if(key==='create'){const proposal=PROPOSAL_FACTORIES.demoCreate();proposal.inspect=true;deliverProposal(proposal);thread.push(ai(tools(['done','Načetl jsem 3 ukázkové odkazy']),proposalPart(proposal)))}
  /* Reorders are low risk: applied straight away with no review step; undo restores the stored previous order. */
  if(key==='sort'){sortUndo={previousOrder:gifts.map(gift=>gift.id),status:'applied'};gifts.sort((first,second)=>priceValue(first.price)-priceValue(second.price));sortUndo.appliedOrder=gifts.map(gift=>gift.id).join();thread.push(ai({type:'sorted'}))}
  renderAll({scroll:'last-user'});revealGhosts();announce(key==='sort'?'Pořadí změněno.':'Asistent připravil návrh.');
}
function decide(key,decision){
  const {entry}=fieldByRef(key);
  entry.decision=entry.decision===decision?null:decision;
  if(entry.decision!=='accepted')entry.value=entry.suggested;
  if(ui.editRef===key){ui.editRef=null;ui.editDraft=null}
  renderAll();document.querySelector(`[data-key="${decision==='accepted'?'acc':'rej'}-${key}"]`)?.focus();announce(entry.decision==='accepted'?`${entry.label}: přijato.`:entry.decision==='rejected'?`${entry.label}: zamítnuto.`:`${entry.label}: bez rozhodnutí.`);
}

document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');
  if(ui.menuGift&&!event.target.closest('#gift-menu')&&!(target&&target.dataset.action==='gift-menu')){ui.menuGift=null;renderPage()}
  if(!target){const demo=event.target.closest('[data-demo]');if(demo){event.preventDefault();toast('Ukázka: tato akce v návrhu nic nedělá.')}return}
  const action=target.dataset.action;
  if(['pick-board','review-select','field-input','send-form'].includes(action))return;
  event.preventDefault();
  switch(action){
    case 'toggle-panel':lastTrigger=target.dataset.key==='entry'?null:target;ui.open?closePanel():openPanel();break;
    case 'close-panel':closePanel();break;
    case 'gift-menu':{lastTrigger=target;const giftId=target.dataset.gift;setMenu(ui.menuGift===giftId?null:giftId,{focus:true});break}
    case 'enrich-gift':{
      const giftId=target.dataset.gift;lastTrigger=document.querySelector(`[data-action="gift-menu"][data-gift="${giftId}"]`);
      if(ui.access==='cap'){ui.menuGift=null;ui.open=true;renderAll({scroll:'bottom'});toast('Dnešní limit je vyčerpaný, obnoví se zítra v 0:00.');break}
      if(giftId==='headphones'){if(ui.access==='demo'){ui.menuGift=null;ui.open=true;demoChip('enrich')}else{loadScenario('enrich')}$('#assistant .as-head button')?.focus();break}
      const gift=gifts.find(item=>item.id===giftId);
      ui.menuGift=null;ui.open=true;ui.view='chat';
      thread=[{type:'context',image:gift.image,name:gift.name,label:'Vylepšit pomocí AI'},ai({type:'stream'})];
      runStream(thread[1].parts[0],{...STREAM_SCRIPTS.generic,text:'Podrobný výsledek je v ukázce připravený pro Sluchátka Sony WH-1000XM5.'});break}
    case 'review':openReview(target.dataset.proposal);break;
    case 'back-to-list':ui.page='wishlist';if(ui.viewport==='mobile')ui.open=false;renderAll();$('#wishlist-title')?.focus();break;
    case 'review-apply':applyFromReview();break;
    case 'inspect':{const proposal=proposals[target.dataset.proposal];proposal.inspect=!proposal.inspect;renderAll();if(proposal.inspect)document.querySelector(`[data-card="${proposal.id}"]`)?.scrollIntoView({block:'nearest'});break}
    case 'apply':{const proposal=proposals[target.dataset.proposal];applyProposal(proposal);renderAll();toast(`Použito: ${changesOfGifts(proposal.appliedCount)}.`);announce('Návrh použit.');document.querySelector(`[data-key="undo-${proposal.id}"]`)?.focus();break}
    case 'decline':{const proposal=proposals[target.dataset.proposal];proposal.status='declined';renderAll();toast('Návrh zamítnut, nic se nezměnilo.');$('#composer')?.focus();break}
    case 'undo-proposal':{const proposal=proposals[target.dataset.proposal];openDialog({title:`Vrátit ${changesOfGifts(proposal.appliedCount)}?`,body:'Dárky se vrátí do stavu před použitím.',confirmLabel:'Vrátit',tone:'danger',onConfirm:()=>{undoProposal(proposal);renderAll();toast('Vráceno.')}});break}
    case 'decide':decide(target.dataset.ref,target.dataset.decision);break;
    case 'edit-field':{const key=target.dataset.ref;if(ui.editRef===key){cancelEdit(key);break}ui.editRef=key;ui.editDraft=null;renderAll();document.querySelector(`[data-key="in-${key}"],[data-key^="cand-${key}-"][aria-checked="true"],[data-key^="cand-${key}-"]`)?.focus();break}
    case 'edit-cancel':cancelEdit(target.dataset.ref);break;
    case 'edit-save':saveEdit(target.dataset.ref);break;
    case 'pick-candidate':ui.editDraft=target.dataset.value;renderAll();document.querySelector(`[data-key="${target.dataset.key}"]`)?.focus();break;
    case 'zoom':openZoom(target.dataset.ref,Number(target.dataset.index));break;
    /* The click on „Smazat 1 dárek“ is the explicit confirmation; undo stays available. */
    case 'confirm-delete':{const proposal=proposals[target.dataset.proposal];const index=Number(target.dataset.index);deleteHeld(proposal,index);renderAll();toast('Dárek smazán.');announce('Dárek smazán. Vrátit jde v asistentovi.');document.querySelector(`[data-key="undo-held-${proposal.id}-${index}"]`)?.focus();break}
    case 'keep-held':{const proposal=proposals[target.dataset.proposal];const index=Number(target.dataset.index);proposal.held[index].status='kept';renderAll();document.querySelector(`[data-key="undo-held-${proposal.id}-${index}"]`)?.focus();break}
    case 'undo-sort':{if(gifts.map(gift=>gift.id).join()!==sortUndo.appliedOrder){toast('Pořadí se mezitím změnilo, vrátit ho už nejde.');break}const positions=new Map(sortUndo.previousOrder.map((giftId,index)=>[giftId,index]));gifts.sort((first,second)=>positions.get(first.id)-positions.get(second.id));sortUndo.status='undone';renderAll();toast('Pořadí vráceno.');announce('Pořadí vráceno.');break}
    case 'undo-held':{const proposal=proposals[target.dataset.proposal];const index=Number(target.dataset.index);const held=proposal.held[index];
      if(held.status==='deleted'){gifts.splice(held.removedIndex,0,held.removed);deletedIds.delete(held.giftId);toast('Dárek je zpět v seznamu.')}
      held.status='pending';renderAll();document.querySelector(`[data-key="del-${proposal.id}-${index}"]`)?.focus();break}
    case 'toggle-trust':ui.trust=!ui.trust;afterTrust();break;
    case 'dismiss-hint':ui.hintDismissed=true;store.set(HINT_KEY,'1');renderAll();$('[data-key="trust"],[data-key="trust-off"]')?.focus();break;
    case 'locate':{const card=document.querySelector(`[data-card="${target.dataset.proposal}"]`);card?.scrollIntoView({block:'start',behavior:'smooth'});break}
    case 'sheet-toggle':setSheet(ui.sheet==='half'?'full':'half');$('[data-key="sheet-toggle"]')?.focus();break;
    case 'open-history':ui.view='history';ui.historyLoading=true;renderAll({scroll:'top'});timers.push(setTimeout(()=>{ui.historyLoading=false;renderPanel({scroll:'top'})},400));$('[data-key="history-back"]')?.focus();break;
    case 'history-back':ui.view='chat';ui.historyLoading=false;if(ui.scenario==='history')thread=CONVERSATIONS.chat();renderAll({scroll:'last-user'});$('[data-key="open-history"]')?.focus();break;
    case 'open-conversation':case 'starter':loadScenario(target.dataset.scenario);break;
    case 'new-chat':clearTimers();streaming=null;ui.view='chat';ui.historyLoading=false;thread=CONVERSATIONS.chat();ui.trust=false;renderAll({scroll:'top'});$('#composer')?.focus();break;
    case 'stop':stopStream();break;
    case 'retry-turn':{const turn=thread[thread.length-1];const part={type:'stream'};turn.parts=[part];runStream(part,STREAM_SCRIPTS.retry);break}
    case 'retry-link':createState.retrying=true;renderPanel();timers.push(setTimeout(()=>{createState.retrying=false;createState.retried=true;const proposal=proposals['p-create'];proposal.failedLink=null;proposal.items.splice(2,0,createItem(NEW_GIFTS.plantbook));renderAll();announce('Odkaz načten, kniha je v návrhu.')},1000));break;
    case 'demo-chip':demoChip(target.dataset.chip);break;
  }
});
function afterTrust(){
  renderAll();
  announce(ui.trust?'Bez kontroly zapnuto pro tuto konverzaci.':'Bez kontroly vypnuto.');
  toast(ui.trust?'Další změny v této konverzaci se použijí hned. Smazání potvrdíte.':'Další návrhy opět počkají na vás.');
}
function cancelEdit(key){ui.editRef=null;ui.editDraft=null;renderAll();document.querySelector(`[data-key="edit-${key}"]`)?.focus()}
/* Saving an edit accepts the field; a changed value shows as „Upraveno“. */
function saveEdit(key){
  const {entry}=fieldByRef(key);
  const control=document.querySelector(`[data-key="in-${key}"]`);
  const value=entry.control==='image'?(ui.editDraft??entry.value):control.value.trim();
  if(!value){control?.focus();return}
  entry.value=value;entry.decision='accepted';ui.editRef=null;ui.editDraft=null;
  renderAll();announce(`${entry.label}: ${value!==entry.suggested?'upraveno a přijato':'přijato'}.`);
  document.querySelector(`[data-key="edit-${key}"]`)?.focus();
}
document.addEventListener('change',event=>{
  const target=event.target;const action=target.dataset.action;
  if(action==='pick-board'){
    createState.choice=target.value;const proposal=proposals['p-create'];
    const boardIndex=proposal.items.findIndex(item=>item.kind==='create'&&['catan','jaipur','duel'].includes(item.gift.id));
    if(boardIndex>=0)proposal.items.splice(boardIndex,1);
    if(target.value!=='none')proposal.items.push(createItem(NEW_GIFTS[target.value]));
    renderAll();
  }
  if(action==='review-select'){ui.reviewSelection[target.dataset.row]=target.checked;renderPage();document.querySelector(`[data-action="review-select"][data-row="${target.dataset.row}"]`)?.focus()}
});
document.addEventListener('submit',event=>{if(event.target.matches('[data-action="send-form"]')){event.preventDefault();sendComposer()}});
function sendComposer(){
  const field=$('#composer');if(!field||field.disabled||streaming)return;
  const value=field.value.trim();if(!value){field.focus();return}
  field.value='';
  thread=thread.filter(message=>!(message.type==='ai'&&message.parts.some(part=>part.type==='starters')));
  thread.push(user(value,'teď'));const part={type:'stream'};thread.push(ai(part));
  runStream(part,STREAM_SCRIPTS.generic);$('[data-key="stop"]')?.focus();
}
document.addEventListener('keydown',event=>{
  if(event.target.id==='composer'&&event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendComposer();return}
  if(ui.editRef&&event.target.matches?.('.finput')){
    if(event.key==='Escape'){event.preventDefault();cancelEdit(ui.editRef);return}
    if(event.key==='Enter'&&(event.target.tagName!=='TEXTAREA'||event.ctrlKey||event.metaKey)){event.preventDefault();saveEdit(ui.editRef);return}
  }
  if(event.target.matches?.('[data-resize]')){
    const step=event.shiftKey?64:16;
    const map={ArrowLeft:ui.panelWidth+step,ArrowRight:ui.panelWidth-step,Home:PANEL_MIN,End:maxWidth()};
    if(event.key in map){event.preventDefault();setWidth(map[event.key])}
    if(event.key==='Enter'){event.preventDefault();setWidth(PANEL_DEFAULT)}
    return;
  }
  if(event.target.matches?.('[data-sheet-grab]')&&['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();setSheet(event.key==='ArrowUp'?'full':'half');return}
  if($('#dialog').open)return;
  if(ui.menuGift&&['ArrowDown','ArrowUp'].includes(event.key)&&event.target.closest('#gift-menu')){
    event.preventDefault();const items=[...document.querySelectorAll('#gift-menu .menu-item:not(:disabled)')];const index=items.indexOf(document.activeElement);
    items[(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();return;
  }
  if(event.key==='Escape'){
    if(ui.menuGift){const giftId=ui.menuGift;setMenu(null);document.querySelector(`[data-action="gift-menu"][data-gift="${giftId}"]`)?.focus();return}
    if(ui.open)closePanel();
  }
});
$('#dialog').addEventListener('close',()=>renderTopbar());

/* ── Toolbar, URL and theme ── */
const OPTIONS={viewport:['desktop','mobile'],theme:['light','dark'],role:['manager','recipient']};
const SCENARIOS=[...document.querySelectorAll('#scenario-select option')].map(option=>option.value);
function readUrl(){
  const params=new URLSearchParams(location.search);
  for(const [key,values] of Object.entries(OPTIONS))if(values.includes(params.get(key)))ui[key]=params.get(key);
  if(SCENARIOS.includes(params.get('scenario')))ui.scenario=params.get('scenario');
}
function writeUrl(){
  const params=new URLSearchParams();
  for(const key of ['viewport','theme','scenario','role'])params.set(key,ui[key]);
  if(!ui.open)params.set('panel','closed');
  history.replaceState(null,'',`${location.pathname}?${params}`);
}
function syncToolbar(){
  document.querySelectorAll('[data-set]').forEach(button=>button.setAttribute('aria-pressed',String(ui[button.dataset.set]===button.dataset.value)));
  $('#scenario-select').value=ui.scenario;
  $('#stage').dataset.viewport=ui.viewport;
  document.documentElement.classList.toggle('dark',ui.theme==='dark');
  document.documentElement.style.setProperty('--bar-height',$('#review-bar').offsetHeight+'px');
}
document.querySelectorAll('[data-set]').forEach(button=>button.addEventListener('click',()=>{
  const key=button.dataset.set;ui[key]=button.dataset.value;syncToolbar();
  if(key==='theme'){writeUrl();return}
  if(key==='viewport'||key==='role')loadScenario(ui.scenario);
  else{renderAll();writeUrl()}
}));
$('#scenario-select').addEventListener('change',event=>loadScenario(event.target.value));
let lastPageScroll=0;
$('#page-scroll').addEventListener('scroll',event=>{
  const top=event.currentTarget.scrollTop;
  const compact=top>24&&top>=lastPageScroll?true:top<lastPageScroll||top<=24?false:ui.fabCompact;
  lastPageScroll=top;
  if(compact!==ui.fabCompact){ui.fabCompact=compact;$('.fab')?.classList.toggle('is-compact',compact)}
},{passive:true});
$('#reset-stored').addEventListener('click',()=>{store.remove(WIDTH_KEY);store.remove(HINT_KEY);ui.hintDismissed=false;ui.panelWidth=PANEL_DEFAULT;renderAll();toast('Uložená šířka a nápověda smazány.')});
window.addEventListener('resize',()=>{syncToolbar();applyWidth();positionMenu()});
$('#page-scroll').addEventListener('scroll',()=>{if(ui.menuGift)positionMenu()},{passive:true});

let toastTimer;
function toast(message){const node=$('#toast');node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,3000)}
function announce(message){const node=$('#announcer');node.textContent='';requestAnimationFrame(()=>node.textContent=message)}

ui.panelWidth=Number(store.get(WIDTH_KEY,PANEL_DEFAULT))||PANEL_DEFAULT;
ui.hintDismissed=store.get(HINT_KEY,'')==='1';
const startParams=new URLSearchParams(location.search);
const startClosed=startParams.get('panel')==='closed';
readUrl();syncToolbar();loadScenario(ui.scenario);
if(startClosed){ui.open=false;renderAll();writeUrl()}
const startScroll=startParams.get('scroll');
if(startScroll){const scroller=$('#page-scroll');requestAnimationFrame(()=>{scroller.scrollTop=startScroll==='end'?scroller.scrollHeight:Number(startScroll)||0})}
</script>
</body>
