/* Task view: header, stepper, collapsed log, step cards, mini review */
const STAGE_INDEX={input:0,running:1,error:1,stopped:1,review:3,sent:3,applied:3,undone:3,outcome:3};
function taskBody(){
  const task=s.task;
  const index=STAGE_INDEX[task.stage];
  const stepNames=['Zadání','Průběh','Výsledek','Kontrola'];
  const stepper=`<ol class="stepper" aria-label="Postup úkolu">${stepNames.map((name,stepIndex)=>{const done=stepIndex<index||(stepIndex===3&&['sent','applied','outcome'].includes(task.stage));const current=stepIndex===index&&!done;return `<li class="${done?'done':current?'current':''}" ${current?'aria-current="step"':''}>${name}${done?'<span class="sr-only">, hotovo</span>':''}</li>`}).join('')}</ol>`;
  const gift=giftById('headphones');
  const target=task.type==='enrich'?`<div class="task-target"><span class="thumb" aria-hidden="true">${gift.photo?photo(gift.photo,true):icon('image')}</span><span class="identity-text"><span class="gift-name">${esc(gift.name)}</span><span class="gift-sub">${gift.price?formatPrice(gift.price):'Bez obrázku, bez ceny'} · sony.cz</span></span></div>`:'';
  const lastMessage=task.log[task.log.length-1];
  const log=`<details class="log" data-key="log"><summary>${icon('message')}<span class="sr-only">Záznam konverzace, ${task.log.length} zprávy. Poslední: </span><span class="log-last" aria-hidden="true">${esc(lastMessage.text.split('\n')[0])}</span><span aria-hidden="true">${task.log.length}</span>${icon('chevron-down','chev-icon')}</summary><div class="log-list">${task.log.map(messageHtml).join('')}</div></details>`;
  return `<div class="task-head">
      <div class="task-top"><button type="button" class="btn sm ghost" data-action="back-tasks" data-key="back-tasks" style="margin-left:-9px">${icon('chevron-left')}Úkoly</button>${task.origin==='menu'?'<span class="badge sm tone-muted">Z menu dárku</span>':''}</div>
      <h3 class="task-title">${TASK_TITLES[task.type]}</h3>${target}${stepper}
    </div>
    ${log}
    ${stepInput(task)}
    ${task.stage==='input'?'':stepProgress(task)}
    ${['review','sent','applied','undone','outcome'].includes(task.stage)?stepResult(task):''}
    ${['review'].includes(task.stage)?miniReview(task):''}
    ${['sent','applied','undone','outcome'].includes(task.stage)?outcomeCards(task):''}`;
}
function stepShell({number,name,summary,done,current,open,body,collapsible=true}){
  const numberHtml=done?icon('check'):number;
  if(!collapsible)return `<section class="step${done?' is-done':''}${current?' is-current':''}" aria-label="Krok ${number}: ${name}"><div class="step-head"><span class="step-num" aria-hidden="true">${numberHtml}</span><span class="step-name">${name}</span>${summary?`<span class="step-sum">${summary}</span>`:''}</div><div class="step-body">${body}</div></section>`;
  return `<details class="step${done?' is-done':''}${current?' is-current':''}" ${open?'open':''} data-key="step-${number}"><summary><span class="step-num" aria-hidden="true">${numberHtml}</span><span class="step-name">${name}<span class="sr-only">${done?', hotovo':''}</span></span><span class="step-sum">${summary||''}</span>${icon('chevron-down','chev-icon')}</summary><div class="step-body">${body}</div></details>`;
}
function stepInput(task){
  const editing=task.stage==='input';
  let body;
  if(task.type==='enrich'){
    body=editing?`<fieldset style="border:0;padding:0;margin:0;display:grid;gap:6px"><legend class="field-label" style="margin-bottom:6px">Který dárek?</legend>
        <div class="radio-list"><label class="radio-card"><input type="radio" name="enrich-gift" checked><span class="thumb" aria-hidden="true">${icon('image')}</span><span class="radio-main"><strong>Sluchátka Sony WH-1000XM5</strong><span>Bez obrázku, bez ceny</span></span></label>
        <label class="radio-card"><input type="radio" name="enrich-gift" data-action="enrich-other"><span class="thumb" aria-hidden="true">${icon('image')}</span><span class="radio-main"><strong>Babiččiny recepty z Valašska</strong><span>Bez obrázku</span></span></label></div></fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="field-label" style="margin-bottom:6px">Co doplnit</legend><div class="check-grid">
        <label class="check-line"><input type="checkbox" checked>Údaje o produktu</label><label class="check-line"><input type="checkbox" checked>Ceny a odkazy</label>
        <label class="check-line"><input type="checkbox" checked>Obrázek</label><label class="check-line"><input type="checkbox" checked>Hodnocení</label></div></fieldset>
      <div class="step-actions"><button type="button" class="btn primary" data-action="run-task" data-key="run-task">${icon('wand')}Spustit vylepšení</button></div>`
      :`<p style="font-size:var(--text-md)">Dárek <strong>Sluchátka Sony WH-1000XM5</strong>: údaje o produktu, ceny a odkazy, obrázek, hodnocení.</p>`;
  } else {
    const label=task.type==='create'?'Odkazy nebo popis, každý dárek na nový řádek':task.type==='bulk'?'Co mám změnit?':'Zadání';
    body=editing?`<label class="field-label" for="task-input">${label}</label><textarea id="task-input" class="input-box" rows="${task.type==='create'?5:3}" data-key="task-input">${esc(task.input)}</textarea>
      ${task.type==='bulk'?'<p class="help" style="margin-top:0">Například: „Dárky z Alzy dej do kategorie Elektronika.“ Před použitím uvidíte každou změnu.</p>':'<p class="help" style="margin-top:0">Stačí vložit odkazy. U obecného popisu nabídnu konkrétní možnosti.</p>'}
      <div class="step-actions"><button type="button" class="btn primary" data-action="run-task" data-key="run-task">${icon('sparkles')}${task.type==='create'?'Připravit dárky':'Připravit změny'}</button></div>`
      :`<p class="quote">${esc(task.input)}</p>`;
  }
  const summary=editing?'':task.type==='enrich'?'Sluchátka Sony WH-1000XM5':task.input.split('\n')[0];
  return stepShell({number:1,name:'Zadání',summary,done:!editing,current:editing,open:editing||task.stage==='error'||task.stage==='stopped',body,collapsible:!editing});
}
function stepProgress(task){
  const lines=PROGRESS[task.type];
  const running=task.stage==='running';
  const items=lines.map(([active,done,flag],lineIndex)=>{
    if(task.stage==='error'&&lineIndex===task.progress)return `<li class="fail">${icon('circle-x')}<span>${active.replace('…','')} se nepodařilo dokončit</span></li>`;
    if(lineIndex<task.progress||(!running&&task.stage!=='error'&&task.stage!=='stopped'))return flag==='fail'?`<li class="fail">${icon('circle-x')}<span>${done}</span></li>`:`<li class="done">${icon('check')}<span>${done}</span></li>`;
    if(lineIndex===task.progress&&running)return `<li class="active">${icon('loader','spinner')}<span>${active}</span></li>`;
    return `<li class="waiting">${icon('circle-dashed')}<span>${active.replace('…','')}</span></li>`;
  }).join('');
  let extra='';
  if(running&&task.type==='enrich'&&task.progress>=2)extra=`<p class="stream" aria-live="polite">Na Heurece vidím 14 nabídek, nejlevnější za 7 990 Kč. Alza má sluchátka skladem za 8 490 Kč. Teď ověřuji, jestli je v zahraničí výrazně levnější<span class="caret" aria-hidden="true"></span></p>`;
  if(task.stage==='error')extra=`<div class="alert destructive compact" role="alert">${icon('alert')}<p class="alert-title">Asistent teď neodpověděl</p><p class="alert-body">Služba AI vrátila chybu. Vaše zadání zůstává uložené a nic se nezměnilo.</p><div class="alert-actions"><button type="button" class="btn primary" data-action="retry" data-key="retry">${icon('refresh')}Zkusit znovu</button></div></div>`;
  if(task.stage==='stopped')extra=`<div class="alert neutral compact" role="status">${icon('square')}<p class="alert-title">Zastaveno</p><p class="alert-body">Asistent přestal hledat. Nic se nezměnilo.</p><div class="alert-actions"><button type="button" class="btn primary" data-action="resume" data-key="resume">Pokračovat</button><button type="button" class="btn secondary" data-action="edit-input" data-key="edit-input">Upravit zadání</button></div></div>`;
  const done=!['running','error','stopped'].includes(task.stage);
  const failedCount=done?lines.filter(line=>line[2]==='fail').length:0;
  const summary=done?`${lines.length-failedCount} z ${lines.length} hotovo`:running?'Pracuji…':task.stage==='error'?'Chyba':'Zastaveno';
  return stepShell({number:2,name:'Průběh',summary,done,current:!done,open:!done,body:`<ul class="progress" aria-live="polite">${items}</ul>${extra}`});
}
function stepResult(task){
  const open=task.stage==='review';
  let body='';let summary='';
  if(task.type==='enrich'){
    const picks=task.picks;
    const frozen=ui.shared;
    summary=`${ENRICH.price} · ${picks.image?'obrázek vybrán':'bez obrázku'}`;
    body=`<div class="result-block"><h4>${icon('info')}Údaje o produktu</h4>
        <dl class="kv"><dt>Značka a model</dt><dd>Sony WH-1000XM5, černá</dd><dt>Název</dt><dd>${frozen?esc(BASE_GIFTS[0].name):esc(ENRICH.newName)}</dd><dt>Popis</dt><dd>${esc(ENRICH.description)}</dd></dl>
        ${frozen?`<p class="kept-note">${icon('lock')}Název ponechám: seznam je sdílený a název dárku už měnit nelze. Popis přidám jako doplnění.</p>`:''}</div>
      <div class="result-block"><h4>${icon('link')}Ceny a odkazy</h4>
        <div class="refs">${ENRICH_REFS.map(ref=>`<label class="ref"><input type="checkbox" ${picks.refs[ref.id]?'checked':''} data-action="toggle-ref" data-ref="${ref.id}" aria-label="Přidat odkaz ${ref.store}" data-key="ref-${ref.id}"><span><span class="ref-store">${ref.store}</span><span class="ref-sub">${ref.sub} · ${ref.link}</span></span><span class="ref-price">${ref.price}</span></label>`).join('')}</div>

function rowStatus(row,task,mode){

function diffLine(diff){

function changeRow(row,task,{selection=task.sel,prefix='row',readonly=false}={}){

  const ops=row.ops>1?`<span class="kind-ops"> · ${row.ops} ${changesWord(row.ops)}</span>`:'';
  const selected=!!selection[row.id];
  const status=readonly?['Použito','success','check']:row.group==='confirm'?(selected?['Potvrzeno','primary','check']:['Vyžaduje potvrzení','warning','alert']):(selected?['Připraveno','success','check']:['Nevybráno','muted',null]);

  const select=readonly?`<span class="done-glyph" aria-hidden="true">${icon('check')}</span>`:`<input type="checkbox" class="check" data-action="${prefix}-check" data-row="${row.id}" ${selected?'checked':''} aria-label="Vybrat změnu: ${kindLabel}, ${esc(name)}" ${row.consequence?`aria-describedby="${prefix}-cons-${row.id}"`:''} data-key="${prefix}-${row.id}">`;

        <div class="kind-counts">${kindCounts(appliedRows)}</div>

        <div class="outcome-actions"><button type="button" class="btn danger" data-action="undo" data-key="undo">${icon('undo')}Vrátit</button><span class="section-note">Vrátí celou dávku najednou.</span></div></section>`;

  }
  if(task.held.length){

      html+=`<section class="outcome applied" role="status"><div class="outcome-head"><span class="outcome-icon" aria-hidden="true">${icon('trash')}</span><div><h3 class="outcome-title">Smazáno: ${task.held.length} ${giftsWord(task.held.length)}</h3><p class="outcome-sub">Potvrdili jste dnes v 10:59</p></div></div><div class="outcome-actions"><button type="button" class="btn danger" data-action="undo-delete" data-key="undo-delete">${icon('undo')}Vrátit</button></div></section>`;

    } else {
      html+=`<section class="outcome held" aria-labelledby="held-title"><div class="outcome-head"><span class="confirm-mark" aria-hidden="true">${icon('alert')}</span><div><h3 class="outcome-title" id="held-title">Čeká na vaše potvrzení</h3><p class="outcome-sub" style="color:var(--foreground)">Smazání se nikdy nepoužije bez potvrzení, ani bez kontroly.</p></div></div>

        <div class="outcome-actions"><button type="button" class="btn destructive" data-action="confirm-delete" data-key="confirm-delete">${icon('trash')}Smazat ${task.held.length} ${giftsWord(task.held.length)}</button><button type="button" class="btn secondary" data-action="keep-held" data-key="keep-held">Nemazat</button></div></section>`;

function panelFooter(){
  const task=s.task;
  const access=s.access;
  if(access==='locked')return '';
  let actionBar='';
  if(task&&task.stage==='review'&&s.tab==='tasks'){
    const rows=rowsFor(task);
    const selected=selectedRows(task);
    const heldCount=selected.filter(row=>row.group==='confirm').length;
    const label=s.fastForward?`Použít vybrané (${selected.length})`:`Odeslat ke kontrole (${selected.length})`;
    const help=s.fastForward?(heldCount?`${selected.length-heldCount} se použije hned, ${heldCount} smazání potvrdíte zvlášť.`:'Použije se hned, půjde vrátit.'):'Zatím se nic nezmění. Použijete na stránce kontroly.';
    actionBar=`<div class="action-bar"><div class="action-text"><span class="action-count">Vybráno ${selected.length} z ${rows.length} ${changesWord(rows.length)}</span><span class="action-help">${help}</span></div><button type="button" class="btn primary" data-action="send" ${selected.length?'':'disabled'} data-key="send">${s.fastForward?icon('check'):icon('arrow-right')}${label}</button></div>`;
  }
  const running=task&&task.stage==='running'&&s.tab==='tasks';
  const disabled=access==='cap'||access==='kill'||access==='demo'||running;
  const placeholder=access==='demo'?'V ukázce vyberte jednu z akcí výše':access==='cap'?'Limit se obnoví zítra v 0:00':access==='kill'?'Asistent je dočasně vypnutý':running?'Asistent pracuje…':task?'Upřesněte úkol, třeba „jen odkazy z Alzy“':'Napište, co mám udělat…';
  const note=access==='demo'?`<p class="composer-note">${icon('info')}Ukázka: odpovědi jsou předpřipravené, nic se neposílá AI.</p>`:access==='cap'?`<p class="composer-note">${icon('gauge')}Dnešní limit AI asistenta jste vyčerpali. Obnoví se zítra v 0:00.</p>`:access==='kill'?`<p class="composer-note">${icon('power')}AI asistent je dočasně vypnutý.</p>`:'';
  const button=running?`<button type="button" class="btn secondary stop-btn" data-action="stop" data-key="stop">${icon('square')}Zastavit</button>`:`<button type="submit" class="btn primary send-btn" aria-label="Odeslat zprávu" ${disabled?'disabled':''} data-key="composer-send">${icon('arrow-up')}</button>`;
  return `<div class="panel-foot">${actionBar}<form class="composer" id="composer" data-action-form="composer"><label class="sr-only" for="composer-input">Zpráva pro asistenta</label><div class="composer-box${disabled&&!running?' is-disabled':''}"><textarea id="composer-input" rows="1" placeholder="${placeholder}" ${disabled?'disabled':''} data-key="composer">${esc(s.draft)}</textarea>${button}</div>${note}</form></div>`;
}

function renderPanel(){
  const panel=document.getElementById('assistant');
  const previousBody=document.getElementById('panel-body');
  const scrollTop=previousBody?previousBody.scrollTop:0;
  const openDetails=new Set([...panel.querySelectorAll('details[open][data-key]')].map(element=>element.dataset.key));
  const closedDetails=new Set([...panel.querySelectorAll('details:not([open])[data-key]')].map(element=>element.dataset.key));
  let body;
  if(s.access==='locked')body=lockedBody();
  else if(s.tab==='history')body=historyBody();
  else if(s.task)body=taskBody();
  else body=launcherBody();
  panel.innerHTML=`${panelHeader()}<div class="panel-body" id="panel-body" role="${s.access==='locked'?'region':'tabpanel'}" aria-label="${s.tab==='history'?'Historie':'Úkoly'}">${body}</div>${panelFooter()}`;
  panel.querySelectorAll('details[data-key]').forEach(element=>{const stageKey=s.task?s.task.type+s.task.stage:s.tab;if(s.preserveDetails&&s.lastStageKey===stageKey){if(openDetails.has(element.dataset.key))element.open=true;if(closedDetails.has(element.dataset.key))element.open=false}});
  s.preserveDetails=true;s.lastStageKey=s.task?s.task.type+s.task.stage:s.tab;
  const nextBody=document.getElementById('panel-body');
  if(nextBody&&!s.resetScroll)nextBody.scrollTop=scrollTop;
  s.resetScroll=false;
  panel.dataset.open=String(s.open);
  panel.dataset.sheet=s.sheet;
  const mobile=ui.viewport==='mobile';
  if(mobile&&s.open){panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true')}else{panel.removeAttribute('role');panel.removeAttribute('aria-modal')}
  panel.toggleAttribute('inert',!s.open);
  document.getElementById('page-scroll').toggleAttribute('inert',mobile&&s.open);
  document.getElementById('device').classList.toggle('panel-open',s.open);
}

function render(){
  const focusKey=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  document.documentElement.classList.toggle('dark',ui.theme==='dark');
  document.getElementById('stage').dataset.viewport=ui.viewport;
  renderTopbar();renderPage();renderPanel();syncToolbar();
  if(focusKey){const next=document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);if(next&&next!==document.activeElement)next.focus({preventScroll:true})}
}

/* ── Review toolbar and URL state ── */
function syncToolbar(){
  for(const [attribute,key] of [['set-viewport','viewport'],['set-theme','theme'],['set-role','role'],['set-shared','shared']]){
    document.querySelectorAll(`[data-${attribute}]`).forEach(button=>button.setAttribute('aria-pressed',String(button.dataset[attribute.replace(/-(\w)/g,(match,letter)=>letter.toUpperCase())]===String(ui[key]))));
  }
  document.getElementById('scenario-select').value=ui.scenario;
  const params=new URLSearchParams(location.search);
  params.set('viewport',ui.viewport);params.set('theme',ui.theme);params.set('scenario',ui.scenario);
  if(ui.role!=='manager')params.set('role',ui.role);else params.delete('role');
  if(!ui.shared)params.set('shared','false');else params.delete('shared');
  history.replaceState(null,'',`${location.pathname}?${params}`);
}
function loadFromUrl(){
  const params=new URLSearchParams(location.search);
  if(['desktop','mobile'].includes(params.get('viewport')))ui.viewport=params.get('viewport');
  if(['light','dark'].includes(params.get('theme')))ui.theme=params.get('theme');
  if(SCENARIO_IDS.includes(params.get('scenario')))ui.scenario=params.get('scenario');
  if(params.get('role')==='recipient')ui.role='recipient';
  if(params.get('shared')==='false')ui.shared=false;
}

let toastTimer;

function runTask(){
  const task=s.task;
  task.stage='running';task.progress=0;task.autoAdvance=true;
  task.log.push({role:'tool',text:'Pracuji na úkolu…',icon:'loader'});
  s.resetScroll=true;render();step();
  function step(){
    later(()=>{
      if(s.task!==task||task.stage!=='running')return;
      task.progress+=1;
      if(task.progress>=PROGRESS[task.type].length){
        task.stage='review';
        task.log.push({role:'assistant',text:`Hotovo. Připravil jsem ${rowsFor(task).length} ${changesWord(rowsFor(task).length)} ke kontrole. Zatím se nic nezměnilo.`});
        render();return;
      }
      render();step();
    },task.type==='sort'?900:750);
  }
}
function applyRows(rows){
  for(const row of rows)row.apply(s.gifts);
  s.updated=new Set(rows.filter(row=>row.kind!=='delete').map(row=>row.gift?row.gift.id:null).filter(Boolean));
  if(rows.some(row=>row.kind==='reorder'))s.updated=new Set();
}
function send(){
  const task=s.task;
  const selected=selectedRows(task);
  if(!selected.length)return;
  if(s.fastForward){
    task.snapshot=structuredClone(s.gifts);
    const immediate=selected.filter(row=>row.group!=='confirm');
    task.held=selected.filter(row=>row.group==='confirm');
    applyRows(immediate);
    task.applied=immediate;
    task.stage='applied';
    task.log.push({role:'assistant',text:`Použil jsem ${immediate.length} ${changesWord(immediate.length)}.${task.held.length?` ${task.held.length} smazání ${plural(task.held.length,'čeká','čekají','čeká')} na vaše potvrzení.`:''}`});
    toast(immediate.length?`Použito: ${immediate.length} ${changesWord(immediate.length)}. Můžete je vrátit.`:'Smazání čekají na vaše potvrzení.');
  } else {
    task.stage='sent';
    task.sentRows=selected.map(row=>row.id);
    s.pending=s.pending.filter(item=>item.type!==task.type).concat({type:task.type,count:selected.length});
    task.log.push({role:'assistant',text:`Návrh s ${selected.length} ${plural(selected.length,'změnou','změnami','změnami')} čeká na kontrolu. Použije se, až ho potvrdíte.`});
    toast('Návrh odeslán ke kontrole. Na stránce seznamu se objevil pruh Čekající změny.');
  }
  s.resetScroll=true;render();
}

/* Review page preview: the full page stays the source of truth (designs/agent-change-review/refined.html). */
let dialogType=null;
function openReviewDialog(type,readonly=false){
  dialogType=type;
  let task=s.task&&s.task.type===type?s.task:null;
  if(!task){task=newTask(type,'sent');rowsFor(task).forEach(row=>{task.sel[row.id]=true});task.sentRows=rowsFor(task).map(row=>row.id);s.task=task;s.tab='tasks'}
  const rows=rowsFor(task).filter(row=>!task.sentRows||task.sentRows.includes(row.id));
  s.dialogRows=rows;
  s.dialogReadonly=readonly||task.stage==='outcome';
  if(!s.dialogReadonly){s.dialogSel={};rows.forEach(row=>{s.dialogSel[row.id]=row.group!=='confirm'})}
  renderDialog();
  const dialog=document.getElementById('review-dialog');
  if(!dialog.open)dialog.showModal();
}
function renderDialog(){
  const dialog=document.getElementById('review-dialog');
  const rows=s.dialogRows;
  const readonly=s.dialogReadonly;
  const selectedCount=rows.filter(row=>s.dialogSel[row.id]).length;
  const normal=rows.filter(row=>row.group!=='confirm');
  const confirm=rows.filter(row=>row.group==='confirm');
  const fakeTask={sel:s.dialogSel};
  dialog.innerHTML=`<div class="browser">
    <div class="browser-bar"><button type="button" class="btn sm ghost" data-action="close-dialog" data-key="dlg-back">${icon('chevron-left')}Zpět na seznam</button><span class="url" title="prejemesi.cz${reviewPath(dialogType)}">prejemesi.cz${reviewPath(dialogType)}</span></div>
    <div class="browser-body">
      <div><p class="rp-eyebrow">Návrh změn</p><h2 class="rp-title" id="rp-title">Vánoce pro babičku</h2><p class="muted" style="font-size:var(--text-md)">Pro: Babička</p></div>
      <div class="rp-summary"><span>Návrh od <strong>${ui.role==='recipient'?'Věra Svobodová':'Petr Svoboda'}</strong> · z AI asistenta</span><span class="muted">Odesláno dnes v 10:44 · Platnost ještě 7 dní</span><div class="kind-counts" style="margin-top:4px">${kindCounts(rows)}</div></div>
      <ul class="rows" role="list">${normal.map(row=>changeRow(row,fakeTask,{prefix:'dlg',readonly})).join('')}</ul>
      ${confirm.length?`<div class="confirm-head"><span class="confirm-mark" aria-hidden="true">${icon('alert')}</span><h3 class="section-title">Vyžaduje potvrzení</h3></div><ul class="rows" role="list">${confirm.map(row=>changeRow(row,fakeTask,{prefix:'dlg',readonly:readonly&&s.dialogSel[row.id]})).join('')}</ul>`:''}
      <p class="rp-note">Zjednodušený náhled stránky kontroly. Plná podoba s kartami před a po: návrh „Refined D“ v designs/agent-change-review.</p>
    </div>
    <div class="browser-foot">${readonly?`<span class="action-count">Návrh je použitý</span><button type="button" class="btn secondary" data-action="close-dialog">Zavřít</button>`:`<span><span class="action-count">Vybráno ${selectedCount} z ${rows.length} ${changesWord(rows.length)}</span><br><span class="action-help">Použije se jedním krokem, půjde vrátit.</span></span><button type="button" class="btn primary" data-action="dialog-apply" ${selectedCount?'':'disabled'} data-key="dlg-apply">${icon('check')}Použít vybrané (${selectedCount})</button>`}</div>
  </div>`;
}
function closeDialog(){const dialog=document.getElementById('review-dialog');if(dialog.open)dialog.close()}
function applyFromDialog(){
  const rows=s.dialogRows;
  const selected=rows.filter(row=>s.dialogSel[row.id]);
  const task=s.task;
  task.snapshot=structuredClone(s.gifts);
  applyRows(selected);
  task.stage='outcome';
  task.outcome={applied:selected.length,total:rows.length,skipped:rows.filter(row=>!s.dialogSel[row.id]).map(row=>`${KIND_META[row.kind][0]} ${row.gift?row.gift.name:row.name}${row.kind==='delete'?' (kopie)':''}`)};
  task.log.push({role:'assistant',text:`Na stránce kontroly jste použili ${selected.length} z ${rows.length} změn.`});
  s.pending=s.pending.filter(item=>item.type!==task.type);
  s.open=true;s.tab='tasks';
  closeDialog();
  s.resetScroll=true;render();
  toast(`Použito ${selected.length} z ${rows.length} změn.`);
}

/* ── Events ── */
document.getElementById('scenario-select').innerHTML=SCENARIOS.map(([id,label])=>`<option value="${id}">${label} (${id})</option>`).join('');
document.getElementById('scenario-select').addEventListener('change',event=>setScenario(event.target.value));
document.querySelectorAll('[data-set-viewport]').forEach(button=>button.addEventListener('click',()=>{ui.viewport=button.dataset.setViewport;render()}));
document.querySelectorAll('[data-set-theme]').forEach(button=>button.addEventListener('click',()=>{ui.theme=button.dataset.setTheme;render()}));
document.querySelectorAll('[data-set-role]').forEach(button=>button.addEventListener('click',()=>{ui.role=button.dataset.setRole;render()}));
document.querySelectorAll('[data-set-shared]').forEach(button=>button.addEventListener('click',()=>{ui.shared=button.dataset.setShared==='true';render()}));
document.getElementById('tool-menu').addEventListener('click',()=>{
  if(ui.viewport==='mobile')s.open=false;
  s.menuFor=s.menuFor==='headphones'?null:'headphones';
  render();
  const slot=document.querySelector('[data-gift="headphones"]');slot&&slot.scrollIntoView({block:'nearest'});
  const item=document.querySelector('[data-key="menu-enrich"]');item&&item.focus({preventScroll:true});
});

document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action],[data-demo]');
  if(s.menuFor&&!event.target.closest('.menu')&&!event.target.closest('[data-action="menu-toggle"]')&&!event.target.closest('.review-bar')){s.menuFor=null;if(!target){render();return}}
  if(s.popover&&!event.target.closest('.popover')&&!event.target.closest('[data-action="popover"]')){s.popover=null;if(!target){render();return}}
  if(!target)return;
  if(target.matches('[data-demo]')&&!target.dataset.action){event.preventDefault();toast('Ukázka: tato akce v návrhu nic nedělá.');return}
  const action=target.dataset.action;
  const task=s.task;
  switch(action){
    case 'toggle-panel':
      if(s.open){closePanel()}else{lastTrigger=target;openPanel()}
      break;
    case 'close-panel':closePanel();break;
    case 'sheet-toggle':s.sheet=s.sheet==='full'?'half':'full';render();break;
    case 'tab':
      s.tab=target.dataset.tab;s.popover=null;s.resetScroll=true;
      if(s.tab==='history'){s.historyLoading=true;later(()=>{s.historyLoading=false;render()},450)}
      render();break;
    case 'popover':s.popover=s.popover===target.dataset.popover?null:target.dataset.popover;render();break;
    case 'ff-toggle':
      s.fastForward=!s.fastForward;render();
      toast(s.fastForward?'Použít změny bez kontroly: zapnuto pro tuto konverzaci.':'Použít změny bez kontroly: vypnuto.');
      break;
    case 'scope-pick':{
      s.scope=target.dataset.scope;s.popover=null;render();
      const scope=WISHLISTS.find(item=>item.id===s.scope);
      if(scope.id!=='babicka')toast(`V aplikaci by se otevřel seznam „${scope.title}“ a asistent by pracoval s ním.`);
      break;}
    case 'start-task':s.task=newTask(target.dataset.type,'input');s.resetScroll=true;render();document.querySelector('[data-key="run-task"]')?.focus({preventScroll:true});break;
    case 'run-task':{const input=document.getElementById('task-input');if(input)s.task.input=input.value.trim()||s.task.input;s.task.log=defaultLog(s.task);if(input)s.task.log[0].text=s.task.input;runTask();break}
    case 'enrich-other':toast('V ukázce je připravený výsledek jen pro sluchátka Sony.');break;
    case 'back-tasks':s.task=null;s.resetScroll=true;render();break;
    case 'new-task':clearTimers();s.task=null;s.tab='tasks';s.chatLog=[];s.fastForward=false;s.resetScroll=true;render();toast('Nová konverzace. Použít bez kontroly je zase vypnuto.');break;
    case 'stop':clearTimers();task.stage='stopped';task.log.push({role:'tool',text:'Zastaveno uživatelem',icon:'square'});render();break;
    case 'resume':runTask();break;
    case 'edit-input':task.stage='input';render();break;
    case 'retry':task.log.push({role:'tool',text:'Zkouším znovu…',icon:'refresh'});runTask();break;
    case 'pick-image':task.picks.image=target.value;render();break;
    case 'no-image':task.picks.image=target.checked?null:'sony';render();break;
    case 'toggle-ref':task.picks.refs[target.dataset.ref]=target.checked;render();break;
    case 'toggle-score':task.picks.score=target.checked;render();break;
    case 'row-check':task.sel[target.dataset.row]=target.checked;render();break;
    case 'dlg-check':s.dialogSel[target.dataset.row]=target.checked;renderDialog();document.querySelector(`[data-key="dlg-${CSS.escape(target.dataset.row)}"]`)?.focus();break;
    case 'choose-game':task.game=target.value;if(task.game!=='none')task.sel['new-game']=true;else delete task.sel['new-game'];render();break;
    case 'retry-link':{
      target.disabled=true;target.innerHTML=`${icon('loader','spinner')}Načítám…`;
      later(()=>{task.linkRetried=true;task.log.push({role:'tool',text:'mall.cz: Polštář na zahradní lavici 120 cm',icon:'check'});render()},1100);
      break;}
    case 'skip-link':task.linkSkipped=true;render();break;
    case 'send':send();break;
    case 'open-full-review':
      if(task.stage==='review'){
        const selected=selectedRows(task);
        task.stage='sent';task.sentRows=selected.map(row=>row.id);
        s.pending=s.pending.filter(item=>item.type!==task.type).concat({type:task.type,count:selected.length});
        task.log.push({role:'assistant',text:'Návrh jsem odeslal a otevřel stránku kontroly.'});
        render();
      }
      openReviewDialog(task.type);break;
    case 'open-review':event.preventDefault();openReviewDialog(target.dataset.type,target.dataset.readonly==='true');break;
    case 'close-dialog':closeDialog();break;
    case 'dialog-apply':applyFromDialog();break;
    case 'undo':
      s.gifts=task.snapshot;s.updated=new Set();
      if(task.stage==='outcome'){task.stage='undone';task.applied=s.dialogRows.filter(row=>s.dialogSel[row.id]);task.held=[]}
      else task.stage='undone';
      task.log.push({role:'assistant',text:'Vrátil jsem celou dávku. Seznam je jako před použitím.'});
      render();toast('Vráceno. Seznam je jako před použitím.');break;
    case 'confirm-delete':
      task.deleteSnapshot=structuredClone(s.gifts);
      task.held.forEach(row=>row.apply(s.gifts));task.heldResolved='deleted';
      task.log.push({role:'assistant',text:`Smazal jsem ${task.held.length} ${giftsWord(task.held.length)}, jak jste potvrdili.`});
      render();toast(`Smazáno: ${task.held.length} ${giftsWord(task.held.length)}.`);break;
    case 'undo-delete':s.gifts=task.deleteSnapshot;task.heldResolved='kept';render();toast('Smazání vráceno.');break;
    case 'keep-held':task.heldResolved='kept';render();break;
    case 'menu-toggle':{
      const id=target.dataset.giftId;
      s.menuFor=s.menuFor===id?null:id;render();
      if(s.menuFor)document.querySelector('#gift-menu .menu-item')?.focus({preventScroll:true});
      break;}
    case 'menu-enrich':{
      const id=target.dataset.giftId;
      if(target.getAttribute('aria-disabled')==='true'){s.menuFor=null;s.open=true;render();break}
      if(id!=='headphones'){toast('V ukázce je připravený výsledek jen pro sluchátka Sony.');break}
      clearTimers();lastTrigger=document.querySelector(`[data-key="more-${id}"]`);
      s.menuFor=null;s.open=true;s.tab='tasks';s.focusGift=id;s.sheet='full';
      s.task=newTask('enrich','running',{origin:'menu'});runTask();break;}
    case 'starter':s.draft=target.dataset.text;render();const input=document.getElementById('composer-input');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}break;
    case 'demo-chip':{
      const type=target.dataset.type;
      s.task=newTask(type,'running',{origin:'demo'});s.task.log[0].text=target.textContent.trim();
      if(type==='enrich')s.focusGift='headphones';
      runTask();break;}
    case 'history-open':{
      const type=target.dataset.type;
      if(target.dataset.id==='h1'){s.tab='tasks';s.task=newTask('enrich','review',{origin:'tile'});s.resetScroll=true;render();toast('Otevřena konverzace z 10:42.');}
      else if(target.dataset.id==='h2'){s.tab='tasks';s.task=newTask('bulk','sent');rowsFor(s.task).forEach(row=>{s.task.sel[row.id]=true});s.task.sentRows=rowsFor(s.task).map(row=>row.id);s.task.stage='outcome';s.task.outcome={applied:5,total:6,skipped:['Smazání dárku LEGO Botanicals Bonsai 10281 (kopie)']};s.task.snapshot=structuredClone(s.gifts);s.resetScroll=true;render();}
      else toast(type==='chat'?'Konverzace jen ke čtení: asistent tehdy nic neměnil.':'V aplikaci by se otevřela konverzace jen ke čtení.');
      break;}
    case 'history-filter':s.historyFilter=target.dataset.filter;render();break;
  }
});
document.addEventListener('change',event=>{
  const target=event.target;
  if(target.matches('input[type=checkbox][data-action],input[type=radio][data-action]'))return;
});
/* Checkbox and radio actions fire on click above; keep keyboard Space consistent through native click events. */
document.addEventListener('input',event=>{if(event.target.id==='composer-input'){s.draft=event.target.value;event.target.style.height='auto';event.target.style.height=Math.min(event.target.scrollHeight,128)+'px'}});
document.addEventListener('keydown',event=>{
  if(event.target.id==='composer-input'&&event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('composer').requestSubmit()}
  if(event.key==='Escape'){
    if(document.getElementById('review-dialog').open)return;
    if(s.menuFor){const id=s.menuFor;s.menuFor=null;render();document.querySelector(`[data-key="more-${id}"]`)?.focus();return}
    if(s.popover){const which=s.popover;s.popover=null;render();document.querySelector(`[data-key="${which==='scope'?'scope-btn':'settings-btn'}"]`)?.focus();return}
    if(s.open&&event.target.closest&&(event.target.closest('#assistant')||ui.viewport==='mobile')){closePanel()}
  }
  if(s.menuFor&&['ArrowDown','ArrowUp'].includes(event.key)&&event.target.closest('#gift-menu')){
    event.preventDefault();
    const items=[...document.querySelectorAll('#gift-menu .menu-item')];
    const index=items.indexOf(event.target);
    items[(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();
  }
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='composer')return;
  event.preventDefault();
  const text=s.draft.trim();
  if(!text)return;
  s.draft='';
  if(s.task&&s.tab==='tasks'){
    s.task.log.push({role:'user',text},{role:'assistant',text:'Rozumím. Upřesnění zohledním, výsledek níže zatím zůstává beze změny, dokud ho znovu nepřipravím.'});
    render();document.querySelector('.log')?.setAttribute('open','');
    return;
  }
  const type=/https?:|odkaz/i.test(text)?'create':/vylepš|obráz|sluchátk/i.test(text)?'enrich':'bulk';
  s.chatLog.push({role:'user',text},{role:'assistant',text:`Rozumím. Připravím to jako úkol „${TASK_TITLES[type]}“, ať vidíte každý krok.`});
  render();
  later(()=>{s.task=newTask(type,'running',{input:type==='enrich'?'':text});s.task.log=[{role:'user',text},{role:'assistant',text:`Připravím to jako úkol „${TASK_TITLES[type]}“.`}];s.chatLog=[];runTask()},700);
});
document.getElementById('review-dialog').addEventListener('close',()=>{render()});
document.getElementById('scrim').addEventListener('click',()=>{if(ui.viewport==='mobile')closePanel()});

loadFromUrl();
s=freshState(ui.scenario);
render();
</script>
