function demoChips(){
  const chips=[['enrich','Vylepšit sluchátka','sparkles'],['create','Přidat 3 dárky z odkazů','link'],['sort','Seřadit podle ceny','reorder']];
  return `<div class="starters" role="group" aria-label="Předpřipravené akce">${chips.map(([action,label,iconName])=>`<button type="button" class="btn secondary" data-action="demo" data-arg="${action}" ${state.usedChips.includes(action)?'disabled':''}>${icon(iconName)}${label}</button>`).join('')}</div>`;
}
function proposalBar(){
  const draftRows=proposalRows(state.proposal);
  const pendingSubmitted=state.submitted&&state.submitted.status==='pending';
  const openBatch=state.batches.find(batch=>batch.open&&!batch.undone);
  const disabled=state.access==='kill'||state.access==='cap';
  let row;
  if(draftRows.length&&!state.ff){
    const editRow=draftRows.length===1&&draftRows[0].kind==='edit'?`<span class="pbar-empty">${enrichFieldNames(draftRows[0].fields)}</span>`:'';
    row=`<div class="pbar-summary"><span class="pbar-label">${icon('sparkles')}Návrh: ${changesLabel(draftRows.length)}</span>${kindCountsHtml(draftRows)}${editRow}</div><button type="button" class="btn primary" data-action="submit-review">Zkontrolovat</button>`;
  }else if(pendingSubmitted){
    const count=proposalRows(state.submitted.proposal).length;
    row=`<div class="pbar-summary"><span class="pbar-label">${icon('hourglass')}Odesláno ke kontrole</span><span class="pbar-empty">${changesLabel(count)}, platnost do 25. 10.</span></div><button type="button" class="btn secondary" data-action="open-review" ${state.access==='kill'?'disabled':''}>Otevřít</button>`;
  }else if(openBatch){
    row=`<div class="pbar-summary"><span class="pbar-label">${icon('check')}Použito: ${changesLabel(openBatch.rows.length)}</span>${state.held.length?`<span class="pbar-empty">${state.held.length} smazání čeká na potvrzení v chatu</span>`:'<span class="pbar-empty">Změny jsou na seznamu</span>'}</div>${undoButton(openBatch).replace('btn reversal sm','btn reversal')}`;
  }else{
    row=`<div class="pbar-summary"><span class="pbar-label">${icon('sparkles')}Návrh</span><span class="pbar-empty">Zatím žádné změny</span></div>`;
  }
  return `<section class="pbar" aria-label="Návrh změn z této konverzace"><div class="pbar-row">${row}</div>
    <div class="pbar-ff"><span class="pbar-ff-label" id="ff-label">Změny z chatu</span>
      <div class="segmented" role="radiogroup" aria-labelledby="ff-label" aria-describedby="ff-help"><button type="button" role="radio" aria-checked="${!state.ff}" data-action="ff" data-arg="off" ${disabled?'disabled':''}>Ke kontrole</button><button type="button" role="radio" aria-checked="${state.ff}" data-action="ff" data-arg="on" ${disabled?'disabled':''}>Rovnou použít</button></div></div>
    <p class="pbar-help${state.ff?' is-on':''}" id="ff-help">${state.ff?'Úpravy a nové dárky se použijí hned. ':''}Smazání, rezervace a pozvánky správců vždy potvrdíte.</p></section>`;
}
function composer(){
  const reason=state.access==='cap'?'Limit se obnoví zítra v 0:00.':state.access==='kill'?'Asistent je dočasně vypnutý.':state.demo?'V ukázce vybíráte jen z připravených akcí.':'';
  const disabled=Boolean(reason);
  const placeholder=reason||(state.panelMode==='gift'?'Upřesněte, co mám u dárku změnit…':'Napište, co mám udělat…');
  const button=state.streaming?`<button type="button" class="btn secondary" data-action="stop">${icon('square')}Zastavit</button>`:`<button type="button" class="btn primary send" data-action="send" aria-label="Odeslat" ${disabled?'disabled':''}>${icon('send')}</button>`;
  return `<div class="composer"><div class="composer-row"><label class="sr-only" for="composer-input">Zpráva pro AI asistenta</label><textarea id="composer-input" rows="1" placeholder="${placeholder}" ${disabled?'disabled':''}>${disabled?'':escapeHtml(state.draft||'')}</textarea>${button}</div>
    ${state.streaming?'<p class="composer-note" role="status">Asistent pracuje. Zastavením nic nezměníte.</p>':''}</div>`;
}
function historyBody(){
  if(state.historyLoading)return `<div class="history" aria-busy="true"><span class="skel" style="height:32px;width:60%"></span>${[1,2,3,4].map(()=>'<span class="skel" style="height:58px"></span>').join('')}</div>`;
  const items=[
    ['enrich','Vylepšení: Sluchátka Sony WH-1000XM5','Dnes 14:20','Čeká na kontrolu','tone-info'],
    ['toast','Dárky z odkazů od Jany','15. 10. v 19:40','3 změny použity','tone-success'],
    ['toast','Nízká priorita pro dražší dárky','9. 10. v 21:05','Vráceno','tone-muted'],
    ['toast','Nápady na dárek do 800 Kč','2. 10. v 18:12','Bez změn','tone-muted'],
    ['toast','Doplnění cen podle Heureky','24. 9. v 20:31','5 změn použito','tone-success']
  ];
  return `<div class="history"><div class="history-head"><h3>Posledních 30 dní</h3><button type="button" class="btn primary sm" data-action="new-chat">${icon('message-plus')}Nová konverzace</button></div>
    <ul class="history-list">${items.map(([target,title,date,outcome,tone])=>`<li><button type="button" class="history-item" data-action="history-open" data-arg="${target}"><span class="history-title">${title}</span><span class="history-date">${date}</span><span class="badge ${tone}">${outcome}</span></button></li>`).join('')}</ul>
    <p class="tip">Konverzace se mažou po 30 dnech. Použité změny zůstávají v historii seznamu.</p></div>`;
}
function lockedBody(){
  return `<div class="locked"><span class="locked-mark" aria-hidden="true">${icon('sparkles')}<span class="lock">${icon('lock')}</span></span>
    <h3>AI asistent je zatím jen pro pozvané testery.</h3>
    <p>Dárky můžete vylepšovat i s vlastní AI. Připojíte ji v Nastavení › Přístup pro AI a aplikace.</p>
    <a class="btn secondary" href="#" data-demo="settings">${icon('key')}Přístup pro AI a aplikace</a></div>`;
}
function previewDock(){
  if(!isMobile()||!state.panelOpen||state.mobileView!=='preview')return '';
  const rows=proposalRows(combinedOverlay());
  return `<div class="preview-dock"><p class="dock-summary">${icon('eye')}${rows.length?`Náhled návrhu: ${kindCountsText(rows)}`:'Náhled seznamu, žádné čekající změny'}</p>${previewToggle()}</div>`;
}

/* ── Main render ── */
function render({resetScroll=false,resetWorkspace=false}={}){
  const active=document.activeElement;
  const focusKey=active&&active.dataset&&active.dataset.action?`[data-action="${active.dataset.action}"]${active.dataset.arg?`[data-arg="${active.dataset.arg}"]`:''}`:active&&active.id?'#'+active.id:null;
  const thread=document.getElementById('thread');const threadScroll=thread?thread.scrollTop:0;
  const workspace=document.getElementById('workspace');const workspaceScroll=workspace?workspace.scrollTop:0;
  const initials=state.demo?'UK':state.role==='manager'?'MN':'VN';
  const accountName=state.demo?'Ukázkový účet':state.role==='manager'?'Martin Novák':'Vlasta Nováková';
  document.getElementById('device').innerHTML=`<div class="shell">
    <header class="topbar"><div class="topbar-inner">
      <a class="logo" href="#" data-demo="chrome" aria-label="Přejeme si, domovská stránka"><span class="logo-mark" aria-hidden="true">${icon('gift')}</span><span>přejeme si<span class="logo-tld">.cz</span></span></a>
      <nav class="nav-links" aria-label="Hlavní navigace"><a class="nav-link" href="#" data-demo="chrome">Moje seznamy ${icon('chevron-down')}</a><a class="nav-link" href="#" aria-current="page" data-demo="chrome">Spravované ${icon('chevron-down')}</a><a class="nav-link" href="#" data-demo="chrome">Sledované ${icon('chevron-down')}</a></nav>
      <div class="nav-right"><button type="button" class="icon-btn only-desktop" aria-label="Paleta barev" data-demo="chrome">${icon('palette')}</button><button type="button" class="icon-btn only-desktop" aria-label="Přepnout tmavý režim" data-action="nav-theme">${icon('moon')}</button>
        <button type="button" class="icon-btn ghost" aria-label="Oznámení, 2 nepřečtená" data-demo="chrome">${icon('bell')}<span class="bell-count" aria-hidden="true">2</span></button>
        <button type="button" class="avatar" aria-label="Účet: ${accountName}" data-demo="chrome">${initials}</button>
        <button type="button" class="icon-btn ghost only-mobile" aria-label="Otevřít menu" data-demo="chrome">${icon('menu')}</button></div></div></header>
    <div class="shell-body"><main class="workspace" id="workspace" data-palette="sky">${state.page==='review'?renderReview():renderWishlist()}</main>${renderPanel()}</div>
    ${previewDock()}<div class="toast" id="toast" role="status" aria-live="polite" hidden></div></div>`;
  const newThread=document.getElementById('thread');
  if(newThread){newThread.scrollTop=resetScroll?0:threadScroll;if(state.scrollThreadEnd){newThread.scrollTop=newThread.scrollHeight}}
  state.scrollThreadEnd=false;
  const newWorkspace=document.getElementById('workspace');if(newWorkspace)newWorkspace.scrollTop=resetScroll||resetWorkspace?0:workspaceScroll;
  if(focusKey){const target=document.querySelector(focusKey);if(target)target.focus({preventScroll:true})}
  const textarea=document.getElementById('composer-input');if(textarea)autoGrow(textarea);
}
function autoGrow(textarea){textarea.style.height='auto';textarea.style.height=Math.min(textarea.scrollHeight+5,132)+'px'}
function showToast(text){const toast=document.getElementById('toast');if(!toast)return;toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const current=document.getElementById('toast');if(current)current.hidden=true},3600)}

/* ── Events ── */
const dialog=document.getElementById('dialog');
function openDeleteConfirmation(rows){
  dialog.innerHTML=`<h2 id="dialog-title">Potvrďte smazání</h2><p class="dialog-text">Spolu s ostatními vybranými změnami smažete:</p>
    <ul class="dialog-list">${rows.map(row=>{const gift=giftById(row.giftId);return `<li class="identity"><span class="thumb sm">${art(gift.art,true)}</span><span class="identity-text"><span class="identity-name">${escapeHtml(gift.name)}</span><span class="identity-sub">Pozice ${positionOf(gift.id)} · ${gift.links[0]}</span></span></li>`}).join('')}</ul>
    <div class="dialog-actions"><button type="button" class="btn secondary" data-dialog="cancel">Zpět</button><button type="button" class="btn destructive" data-dialog="confirm">${icon('trash')}Použít a smazat</button></div>`;
  dialog.showModal();
}
dialog.addEventListener('click',event=>{
  const button=event.target.closest('[data-dialog]');if(!button)return;
  dialog.close();if(button.dataset.dialog==='confirm')applyReview();
});
function closePanel(){
  clearTimers();if(state.stream){state.stream=null}
  state.panelOpen=false;state.panelMenu=false;state.streaming=false;state.workingGift=null;render();
  const trigger=document.getElementById(lastTrigger)||document.getElementById('ai-trigger');if(trigger)trigger.focus();
}
const ACTIONS={
  'toggle-panel':()=>{if(state.panelOpen&&!isMobile()){closePanel();return}lastTrigger='ai-trigger';state.panelOpen=true;state.mobileView='chat';state.page=state.page;render();const close=document.querySelector('[data-action="close-panel"]');if(close)close.focus()},
  'close-panel':closePanel,
  'panel-menu':()=>{state.panelMenu=!state.panelMenu;render();if(state.panelMenu)document.querySelector('.panel-menu [role=menuitem]').focus()},
  'new-chat':()=>applyScenario(state.demo?'demo':'chat'),
  'open-history':()=>{state.panelMenu=false;state.panelView='history';state.historyLoading=true;render();later(()=>{state.historyLoading=false;render()},700)},
  'close-history':()=>{state.panelView='thread';if(!state.thread.length)state.thread=[{type:'welcome'}];render()},
  'history-open':arg=>{if(arg==='enrich')applyScenario('enrich');else showToast('Ukázka: otevře uloženou konverzaci, jen ke čtení.')},
  'gift-menu':arg=>{state.menuFor=state.menuFor===arg?null:arg;render();if(state.menuFor){const first=document.querySelector('.gift-menu [role=menuitem]');if(first)first.focus()}},
  'enrich-gift':(arg,element)=>{
    if(element.getAttribute('aria-disabled')==='true'){showToast('AI asistent je dočasně vypnutý.');return}
    lastTrigger='';state.menuFor=null;
    if(state.access==='cap'){state.panelOpen=true;state.mobileView='chat';state.scrollThreadEnd=true;render();showToast('Dnešní limit je vyčerpaný, obnoví se zítra v 0:00.');return}
    runEnrichFlow(arg,{append:state.demo});
  },
  'exit-workbench':()=>{state.panelMode='chat';state.focusGift=null;render()},
  'locate-gift':()=>{const id=state.focusGift;state.flashGift=id;render();const card=document.getElementById('gift-'+id);if(card)card.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});later(()=>{state.flashGift=null;render()},1200)},
  'toggle-pin':()=>{state.pinExpanded=!state.pinExpanded;render()},
  'mobile-view':arg=>{state.mobileView=arg;render();if(arg==='preview'){const id=state.focusGift||Object.keys(combinedOverlay().edits)[0];const card=id&&document.getElementById('gift-'+id);if(card)card.scrollIntoView({block:'center'})}},
  decide:arg=>{const [key,value]=arg.split(':');state.enrich.rows[key]=state.enrich.rows[key]===value?'pending':value;afterProposalChange()},
  'pick-image':arg=>{const enrich=state.enrich;if(arg==='none'){enrich.imagePick=null;enrich.rows.image='rejected'}else{const index=Number(arg);enrich.imagePick=enrich.imagePick===index?null:index;enrich.rows.image=enrich.imagePick===null?'pending':'accepted'}afterProposalChange()},
  'accept-all':()=>{const enrich=state.enrich;for(const key of Object.keys(enrich.rows))if(key!=='image')enrich.rows[key]='accepted';if(enrich.imagePick===null){enrich.imagePick=0;enrich.rows.image='accepted'}afterProposalChange()},
  'choose-game':arg=>{state.create.pick=arg;state.proposal.creates=state.proposal.creates.filter(gift=>!['new-patchwork','new-jaipur','new-duel'].includes(gift.id));state.proposal.creates.push(clone(DRAFTS[arg]));afterProposalChange()},
  'retry-link':retryFailedLink,
  'skip-link':()=>{state.create.failed='skipped';render()},
  'submit-review':submitForReview,
  'open-review':()=>{if(state.submitted&&state.submitted.status==='pending')openReview()},
  'back-to-list':()=>{state.page='wishlist';render({resetWorkspace:true})},
  'review-select':(arg,element)=>{state.reviewSelection[arg]=element.checked;render()},
  'apply-review':()=>{const rows=proposalRows(state.submitted.proposal).filter(row=>row.confirm&&state.reviewSelection[row.id]);if(rows.length)openDeleteConfirmation(rows);else applyReview()},
  undo:arg=>undoBatch(arg),
  ff:arg=>{const on=arg==='on';if(state.ff===on)return;state.ff=on;if(on){commitFastForward();showToast('Úpravy a nové dárky se teď použijí hned. Smazání potvrdíte.')}else{state.batches.forEach(batch=>batch.open=false);showToast('Další změny půjdou znovu ke kontrole.')}render()},
  'held-delete':()=>{const snapshot=clone(state.gifts);state.gifts=state.gifts.filter(gift=>!state.held.includes(gift.id));state.batches.push({id:'batch-del',snapshot,rows:state.held.map(id=>({id:'del:'+id,kind:'delete'})),open:false,undone:false});state.held=[];state.heldResolved='deleted';render()},
  'held-keep':()=>{state.held=[];state.heldResolved='kept';render()},
  stop:stopWorking,
  'retry-provider':retryProvider,
  send:()=>{const textarea=document.getElementById('composer-input');const text=textarea.value;state.draft='';sendMessage(text)},
  starter:arg=>{if(arg==='enrich')runEnrichFlow('sony');else applyScenario(arg)},
  demo:arg=>demoAction(arg),
  'nav-theme':()=>setTheme(state.theme==='dark'?'light':'dark')
};
document.getElementById('device').addEventListener('click',event=>{
  const actionTarget=event.target.closest('[data-action]');
  if(actionTarget&&!actionTarget.disabled){
    if(actionTarget.type==='checkbox'){return}
    event.preventDefault();const handler=ACTIONS[actionTarget.dataset.action];if(handler)handler(actionTarget.dataset.arg,actionTarget);return;
  }
  const demo=event.target.closest('[data-demo]');
  if(demo){event.preventDefault();state.menuFor=null;state.panelMenu=false;render();showToast(demo.dataset.demo==='link'?'Ukázkový odkaz, obchod se neotevře.':demo.dataset.demo==='settings'?'Ukázka: vede do Nastavení › Přístup pro AI a aplikace.':'Ukázka: tato část aplikace není součástí návrhu.');return}
  if((state.menuFor||state.panelMenu)&&!event.target.closest('.menu')){state.menuFor=null;state.panelMenu=false;render()}
});
document.getElementById('device').addEventListener('change',event=>{
  const target=event.target;if(target.dataset.action==='review-select')ACTIONS['review-select'](target.dataset.arg,target);
});
document.getElementById('device').addEventListener('input',event=>{if(event.target.id==='composer-input'){state.draft=event.target.value;autoGrow(event.target)}});
document.getElementById('device').addEventListener('keydown',event=>{
  if(event.target.id==='composer-input'&&event.key==='Enter'&&!event.shiftKey){event.preventDefault();if(!state.streaming)ACTIONS.send()}
  const menu=event.target.closest('.menu');
  if(menu&&(event.key==='ArrowDown'||event.key==='ArrowUp')){
    event.preventDefault();const items=[...menu.querySelectorAll('[role=menuitem]')];const index=items.indexOf(event.target);
    items[(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();
  }
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape'||dialog.open)return;
  if(state.menuFor){const id=state.menuFor;state.menuFor=null;render();const trigger=document.querySelector(`[data-action="gift-menu"][data-arg="${id}"]`);if(trigger)trigger.focus();return}
  if(state.panelMenu){state.panelMenu=false;render();document.querySelector('[data-action="panel-menu"]').focus();return}
  if(state.panelOpen)closePanel();
});

/* ── Review toolbar and URL state ── */
function syncUrl(){
  const params=new URLSearchParams({viewport:state.viewport,theme:state.theme,scenario:state.scenario});
  if(state.role!=='manager')params.set('role',state.role);
  history.replaceState(null,'',`${location.pathname}?${params}`);
}
function setPressed(attribute,value){document.querySelectorAll(`[${attribute}]`).forEach(button=>button.setAttribute('aria-pressed',String(button.getAttribute(attribute)===value)))}
function setViewport(viewport){state.viewport=viewport;document.getElementById('stage').dataset.viewport=viewport;setPressed('data-viewport-option',viewport);if(viewport==='mobile'){state.mobileView='chat'}syncUrl();render()}
function setTheme(theme){state.theme=theme;document.documentElement.classList.toggle('dark',theme==='dark');setPressed('data-theme-option',theme);syncUrl()}
function setRole(role){state.role=role;setPressed('data-role-option',role);syncUrl();render()}
document.querySelectorAll('[data-viewport-option]').forEach(button=>button.addEventListener('click',()=>setViewport(button.dataset.viewportOption)));
document.querySelectorAll('[data-theme-option]').forEach(button=>button.addEventListener('click',()=>setTheme(button.dataset.themeOption)));
document.querySelectorAll('[data-role-option]').forEach(button=>button.addEventListener('click',()=>setRole(button.dataset.roleOption)));
const select=document.getElementById('scenario-select');
select.innerHTML=SCENARIOS.map(([id,label])=>`<option value="${id}">${id} · ${label}</option>`).join('');
select.addEventListener('change',()=>applyScenario(select.value));

const params=new URLSearchParams(location.search);
const initialViewport=params.get('viewport')==='mobile'?'mobile':'desktop';
const initialTheme=params.get('theme')==='dark'?'dark':'light';
const initialScenario=SCENARIOS.some(([id])=>id===params.get('scenario'))?params.get('scenario'):'enrich';
state.viewport=initialViewport;document.getElementById('stage').dataset.viewport=initialViewport;setPressed('data-viewport-option',initialViewport);
state.role=params.get('role')==='recipient'?'recipient':'manager';setPressed('data-role-option',state.role);
setTheme(initialTheme);
applyScenario(initialScenario);
</script>
</body>
</html>
