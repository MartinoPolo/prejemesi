<title>Refined · Klávesnice na mobilu · Přejeme si</title>
<style>
@font-face{font-family:'DynaPuff Variable';src:url('../unavailable-gift-comparison/assets/dynapuff-latin-wght-normal.woff2') format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+20AC}
@font-face{font-family:'DynaPuff Variable';src:url('../unavailable-gift-comparison/assets/dynapuff-latin-ext-wght-normal.woff2') format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20AB}
@font-face{font-family:'Geist Variable';src:url('../unavailable-gift-comparison/assets/geist-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2190-21FF}
@font-face{font-family:'Geist Variable';src:url('../unavailable-gift-comparison/assets/geist-latin-ext-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF,U+20A0-20AB}

/* Standalone mirror of src/app.css (palette sky), copied from designs/ai-chatbot/refined.html. */
html{
  --p-brand:#1e9be9;--p-deep:#1265a8;--p-ink:#16385c;--p-bright:#55b9f3;--p-accent:#ffc93c;--p-on-accent:#16385c;
  --p-primary:color-mix(in oklab,var(--p-brand) 20%,var(--p-deep));--p-on-primary:#fff;
  --ink:var(--p-ink);--brand:var(--p-brand);--brand-deep:var(--p-deep);--brand-link:var(--brand-deep);
  --tint:color-mix(in oklab,var(--p-brand) 21%,white);--panel-hover:color-mix(in oklab,var(--p-brand) 6%,white);
  --accent-loud:var(--p-accent);--accent-loud-foreground:var(--p-on-accent);
  --background:color-mix(in oklab,var(--p-brand) 11%,white);--foreground:var(--p-ink);--card:#fff;
  --primary:var(--p-primary);--primary-hover:color-mix(in oklab,var(--primary) 86%,var(--p-ink));--primary-foreground:var(--p-on-primary);
  --primary-soft:color-mix(in oklab,var(--p-brand) 14%,white);
  --secondary:color-mix(in oklab,var(--p-brand) 6%,white);--muted:color-mix(in oklab,var(--p-brand) 4%,white);
  --muted-foreground:color-mix(in oklab,var(--p-ink) 78%,transparent);--accent:color-mix(in oklab,var(--p-brand) 11%,white);
  --border:color-mix(in oklab,var(--p-ink) 12%,transparent);--border-strong:color-mix(in oklab,var(--p-ink) 30%,transparent);--surface:var(--background);
  --rule-line:color-mix(in oklab,var(--ink) 10%,transparent);--margin-red:#e4574c;--pattern-dot:color-mix(in oklab,var(--ink) 13%,transparent);
  --soft-shadow:color-mix(in oklab,var(--p-ink) 16%,transparent);--soft-shadow-strong:color-mix(in oklab,var(--p-ink) 20%,transparent);
  --hard-shadow:var(--soft-shadow);
  --status-success:#14a56f;--status-danger:#e4574c;
  --status-success-text:color-mix(in oklab,var(--status-success) 45%,var(--ink));
  --status-danger-text:color-mix(in oklab,var(--status-danger) 60%,var(--ink));
  --status-danger-fill:color-mix(in oklab,var(--status-danger) 75%,var(--ink));
  --gift-overlay-unavailable:#163b60;
  --priority-bg:oklch(.93 .05 75);--priority-fg:oklch(.50 .12 75);
  --switch-track:color-mix(in oklab,var(--p-ink) 20%,transparent);--switch-thumb:#fff;--switch-thumb-active:#fff;
  color-scheme:light;
}
html.dark{
  --p-primary:color-mix(in oklab,var(--p-brand) 60%,#202630);--p-on-primary:#fff;
  --ink:color-mix(in oklab,var(--p-bright) 12%,#e6e8ec);--brand:color-mix(in oklab,var(--p-bright) 70%,#b8bec8);--brand-link:var(--brand);
  --tint:var(--accent);--panel-hover:var(--secondary);
  --accent-loud:color-mix(in oklab,var(--p-accent) 65%,#b8bec8);--accent-loud-foreground:#18202b;
  --background:color-mix(in oklab,var(--p-deep) 10%,#090b0f);--foreground:var(--ink);
  --card:color-mix(in oklab,var(--p-deep) 16%,#13161c);
  --primary:var(--p-primary);--primary-hover:color-mix(in oklab,var(--primary) 92%,black);--primary-foreground:#fff;
  --primary-soft:color-mix(in oklab,var(--primary) 24%,var(--card));
  --secondary:color-mix(in oklab,var(--p-deep) 22%,#1c2027);--muted:color-mix(in oklab,var(--p-deep) 12%,#181b21);
  --muted-foreground:color-mix(in oklab,var(--ink) 65%,transparent);--accent:color-mix(in oklab,var(--p-deep) 26%,#222630);
  --border:color-mix(in oklab,var(--ink) 16%,transparent);--border-strong:color-mix(in oklab,var(--ink) 40%,transparent);
  --rule-line:color-mix(in oklab,var(--ink) 15%,transparent);--margin-red:#f07a6e;
  --soft-shadow:rgb(2 6 12 / 42%);--soft-shadow-strong:rgb(2 6 12 / 55%);
  --status-success:#3bd598;--status-danger:#f07a6e;
  --status-success-text:var(--status-success);
  --status-danger-text:color-mix(in oklab,var(--status-danger) 90%,white);
  --status-danger-fill:color-mix(in oklab,var(--status-danger) 60%,#202630);
  --gift-overlay-unavailable:#2b5d91;
  --priority-bg:oklch(.28 .04 75);--priority-fg:oklch(.78 .08 75);
  --switch-track:color-mix(in oklab,var(--ink) 25%,transparent);--switch-thumb:var(--ink);
  color-scheme:dark;
}
html{
  --radius-panel:16px;--radius-btn:7px;--radius-badge:12px;
  --size-control-sm:26px;--size-control-md:32px;--size-control-lg:40px;--size-control-xl:48px;
  --text-2xs:10.5px;--text-xs:11px;--text-sm:12px;--text-md:13px;--text-base:14px;--text-lg:15px;--text-xl:17px;--text-2xl:22px;--text-3xl:28px;
  --font-head:'DynaPuff Variable',Arial,sans-serif;--font-body:'Geist Variable',Arial,sans-serif;
  --ghost-tint:color-mix(in oklab,var(--brand) 7%,var(--card));
  --keyboard-motion:.25s cubic-bezier(.2,.8,.2,1);
}
/* Mobile elevation offsets and control size, as inside the refined phone frame. */
.viewport{
  --elevation-compact-offset:1px;--elevation-ordinary-offset:3px;--elevation-lifted-offset:4px;
  --nested-control-gap:.5rem;--compact-control-gap:.375rem;--gutter:12px;--control:var(--size-control-lg);
}
.viewport,.viewport *{
  --elevation-compact:var(--elevation-compact-offset) var(--elevation-compact-offset) 0 var(--hard-shadow);
  --elevation-ordinary:var(--elevation-ordinary-offset) var(--elevation-ordinary-offset) 0 var(--hard-shadow);
  --elevation-lifted:var(--elevation-lifted-offset) var(--elevation-lifted-offset) 0 var(--hard-shadow);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#161a20;color:#e8ebf0;font:var(--text-base)/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg.icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Review tooling (outside the design tokens) ── */
.review-bar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 14px;background:#0d1015;color:#e8ebf0;border-bottom:1px solid #2b323c;font:12px/1.3 'Geist Variable',Arial,sans-serif}
.review-eyebrow{font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#ffc93c;margin-right:auto}
.review-group{display:flex;align-items:center;gap:5px}
.review-group>span,.review-group>label{color:#9aa4b2;font-weight:600}
.review-group button,.review-group select{min-height:26px;padding:3px 8px;border:1px solid #3a4350;border-radius:6px;background:#1b222b;color:#e8ebf0;font-weight:600}
.review-group button[aria-pressed=true]{background:#e8ebf0;color:#0d1015;border-color:#e8ebf0}
.review-group button:disabled{opacity:.4;cursor:not-allowed}
.review-group :focus-visible{outline:2px solid #ffc93c;outline-offset:2px}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:28px 40px;padding:32px 16px 56px}
.notes{width:300px;padding:14px 16px;border:1px dashed #6b7686;border-radius:8px;background:#0d1015;font:13px/1.45 'Geist Variable',Arial,sans-serif;color:#d5dae1}
.notes h2{margin-bottom:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffc93c}
.notes ul{display:grid;gap:6px;padding-left:16px;list-style:disc}
.notes .readout{margin-top:12px;padding-top:10px;border-top:1px solid #2b323c;font:600 12px/1.5 ui-monospace,Consolas,monospace;color:#9aa4b2}
.notes .readout strong{color:#e8ebf0}

/* ── Phone frame: browser chrome, viewport above keyboard, keyboard, gesture bar ── */
.phone{position:relative;width:390px;height:844px;flex:none;display:flex;flex-direction:column;overflow:hidden;border-radius:42px;background:#000;box-shadow:0 0 0 9px #1c2026,0 0 0 10px #3a4350,0 30px 70px rgb(0 0 0 / 55%)}
.chrome{flex:none;height:110px;display:flex;flex-direction:column;background:#fff;color:#1f2329;font-family:'Geist Variable',Arial,sans-serif}
html.dark .chrome{background:#1f2329;color:#e8eaed}
.statusbar{height:38px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:14px;font-weight:600}
.statusbar svg{width:15px;height:15px;fill:currentColor;stroke:none}
.status-icons{display:flex;gap:6px;align-items:center}
.urlbar{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px}
.url-pill{flex:1;min-width:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:999px;background:#eef1f5;font-size:15px}
html.dark .url-pill{background:#2d3238}
.url-pill svg.icon{width:15px;height:15px;opacity:.7}
.url-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.url-text b{font-weight:500}
.url-text span{opacity:.6}
.tab-count{width:22px;height:22px;display:grid;place-items:center;border:2px solid currentColor;border-radius:5px;font-size:11px;font-weight:700}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--background);color:var(--foreground)}
.keyboard{position:relative;flex:none;height:var(--keyboard-height,0px);overflow:hidden;background:#202124;transition:height var(--keyboard-motion)}
.keyboard.no-motion{transition:none}
.kb-inner{position:absolute;inset:0 0 auto;height:var(--keyboard-inner,336px);display:flex;flex-direction:column;padding:0 4px 6px;color:#e8eaed;font-family:Roboto,'Geist Variable',Arial,sans-serif}
.kb-tools{flex:none;height:44px;display:flex;align-items:center;justify-content:space-around;color:#c4c7c5}
.kb-tools svg.icon{width:20px;height:20px}
.kb-suggest{flex:none;height:40px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:16px;color:#e8eaed}
.kb-suggest span{text-align:center;border-left:1px solid #3c4043}
.kb-suggest span:first-child{border-left:0}
.kb-suggest span.main{font-weight:700}
.kb-suggest.single{grid-template-columns:1fr}
.kb-suggest .pw{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;border:0}
.kb-rows{flex:1;display:flex;flex-direction:column;gap:7px;padding-top:4px}
.kb-row{flex:1;display:flex;gap:5px}
.kb-row.indent{padding:0 17px}
.kb-key{flex:1;display:grid;place-items:center;border-radius:7px;background:#3c4043;font-size:20px;line-height:1}
.kb-key.fn{flex:1.45;background:#2b2e31;font-size:15px}
.kb-key.space{flex:4.6;font-size:13px;color:#bdc1c6}
.kb-key.enter{flex:1.45;border-radius:999px;background:#a8c7fa;color:#062e6f;font-size:20px}
.kb-key.num{font-size:18px}
.android-nav{flex:none;height:48px;display:flex;align-items:center;justify-content:center;position:relative;background:#202124}
html:not(.dark) .phone[data-kb=closed] .android-nav{background:var(--card)}
.gesture-pill{width:108px;height:4px;border-radius:999px;background:#e8eaed}
html:not(.dark) .phone[data-kb=closed] .gesture-pill{background:#1f2329}
.hide-kb{position:absolute;left:14px;top:4px;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:999px;background:transparent;color:#e8eaed}
.hide-kb:focus-visible{outline:2px solid #a8c7fa;outline-offset:0}
.phone[data-kb=closed] .hide-kb{display:none}

/* ── App primitives (Button / Input / Switch mirrors) ── */
.viewport :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.viewport a{color:var(--brand-link)}
.icon-btn{width:var(--control);height:var(--control);display:inline-grid;place-items:center;flex:none;padding:0;border:2.5px solid var(--ink);border-radius:var(--radius-btn);background:var(--card);color:var(--ink);box-shadow:var(--elevation-ordinary)}
.icon-btn:hover:not(:disabled){background:var(--panel-hover)}
.icon-btn.ghost{border-color:transparent;background:transparent;box-shadow:none;position:relative}
.icon-btn.ghost:hover:not(:disabled){background:var(--accent)}
.icon-btn[aria-expanded=true]{background:var(--primary-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control);padding:0 13px;border:2.5px solid var(--ink);border-radius:var(--radius-btn);background:var(--card);color:var(--ink);font:600 var(--text-base)/1 var(--font-body);white-space:nowrap;text-decoration:none;box-shadow:var(--elevation-ordinary)}
.btn.sm{height:var(--size-control-md);padding:0 9px;font-size:var(--text-md);border-width:2px;box-shadow:var(--elevation-compact)}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover:not(:disabled){background:var(--primary-hover)}
.btn.secondary:hover:not(:disabled){background:var(--panel-hover)}
.btn.quiet{border-color:transparent;background:transparent;box-shadow:none;color:var(--foreground)}
.btn.quiet:hover:not(:disabled){background:var(--accent)}
.btn.quiet[aria-pressed=true]{background:var(--primary-soft)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;color:var(--brand-link);font-weight:600;font-size:var(--text-sm);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  .btn,.icon-btn{transition:translate .15s ease,box-shadow .15s ease,background-color .15s ease}
  .btn:not(.quiet):active:not(:disabled),.icon-btn:not(.ghost):active:not(:disabled){translate:1px 1px;box-shadow:var(--elevation-compact)}
}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border:2px solid var(--ink);border-radius:var(--radius-badge);background:var(--card);font-size:var(--text-xs);font-weight:700;white-space:nowrap}
.field{display:grid;gap:4px;min-width:0}
.field+.field,.field+.pair,.pair+.field,.pair+.triple,.triple+.section{margin-top:14px}
.field-label{font-size:var(--text-sm);font-weight:600}
.field-help{font-size:var(--text-sm);color:var(--muted-foreground)}
.control{width:100%;min-width:0;height:var(--control);padding:0 11px;border:2.5px solid var(--ink);border-radius:var(--radius-btn);background:var(--card);font-size:16px}
textarea.control{height:auto;min-height:88px;padding:8px 11px;resize:vertical;line-height:1.4}
select.control{padding-right:6px}
.control:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
/* The focused input of each scenario carries the focus ring whenever the keyboard is open. */
.viewport[data-kb=open] [data-focus-target]{outline:3px solid var(--brand);outline-offset:1px}
.switch{position:relative;width:36px;height:22px;flex:none;padding:0;border:2px solid var(--ink);border-radius:999px;background:var(--switch-track)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border:2px solid var(--ink);border-radius:999px;background:var(--switch-thumb);transition:translate .15s ease}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]::after{translate:14px 0;background:var(--switch-thumb-active)}
.switch::before{content:"";position:absolute;inset:-9px -4px}

/* ── Wishlist page (existing chrome, final state) ── */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 var(--gutter) 0 6px;background:var(--card);border-bottom:2.5px solid var(--ink)}
.logo{display:flex;align-items:center;gap:8px;font:700 var(--text-lg) var(--font-head);color:var(--ink);letter-spacing:-.02em;text-decoration:none}
.viewport .logo{color:var(--ink)}
.logo-mark{width:30px;height:30px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,var(--brand),var(--brand-deep));border:2px solid var(--ink);border-radius:10px;transform:rotate(-4deg)}
.logo-mark svg.icon{width:18px;height:18px}
.logo-tld{opacity:.42;font-weight:500}
.nav-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.bell-count{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--status-danger-fill);color:#fff;font-size:10px;font-weight:800;line-height:15px;text-align:center}
.avatar{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:999px;background:var(--tint);color:var(--ink);font-size:var(--text-sm);font-weight:800;padding:0}
.page-scroll{flex:1;min-height:0;overflow-y:auto}
.page{padding:16px var(--gutter) 32px}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 14px 14px 40px;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background-color:var(--card);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule-line) 27px 28px);box-shadow:var(--elevation-ordinary)}
.hero::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:color-mix(in oklab,var(--margin-red) 55%,transparent)}
.hero-holes{position:absolute;left:7px;top:14px;bottom:14px;display:flex;flex-direction:column;justify-content:space-around}
.hero-holes span{width:12px;height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--background)}
.hero-for{font-size:var(--text-md);font-weight:600;color:var(--muted-foreground)}
.hero h1{margin-top:2px;font:600 var(--text-2xl)/1.2 var(--font-head)}
.hero-meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:var(--text-sm);color:var(--muted-foreground)}
.hero-meta span{display:inline-flex;align-items:center;gap:4px}
.hero-meta svg.icon{width:13px;height:13px}
.toolbar{display:flex;align-items:center;gap:var(--nested-control-gap);margin-top:16px}
.toolbar .spacer{flex:1}
.segmented{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--accent);box-shadow:var(--elevation-compact)}
.segmented button{display:inline-grid;place-items:center;width:38px;height:34px;padding:0;border:2.5px solid transparent;border-radius:var(--radius-btn);background:transparent;color:var(--ink)}
.segmented button[aria-pressed=true]{background:var(--card);border-color:var(--ink)}
.gift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.gift{position:relative;min-width:0;display:grid;grid-template-rows:auto 1fr auto;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background:var(--card);box-shadow:var(--elevation-ordinary);overflow:hidden}
.image-area{position:relative;aspect-ratio:4/3;background:var(--surface);border-bottom:3px solid var(--ink);overflow:hidden}
.image-area img{width:100%;height:100%;object-fit:cover;display:block}
.category{position:absolute;z-index:2;top:6px;left:6px;max-width:calc(100% - 40px);padding:1px 5px;border:2px solid #000;border-radius:6px;color:#16385c;font-size:10px;line-height:13px;font-weight:800;transform:rotate(-3deg);box-shadow:var(--elevation-compact);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.priority{position:absolute;z-index:2;bottom:8px;left:8px;height:19px;padding:0 7px;border-radius:999px;background:var(--priority-bg);color:var(--priority-fg);font-size:var(--text-2xs);line-height:19px;font-weight:700}
.state{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center}
.state span{padding:3px 8px;border:2px solid var(--ink);border-radius:var(--radius-panel);background:var(--gift-overlay-unavailable);color:#fff;font-size:var(--text-xs);font-weight:700;transform:rotate(-1deg);box-shadow:var(--elevation-compact)}
.gift-body{min-width:0;padding:8px 8px 2px}
.gift-title{font:600 var(--text-lg)/1.3 var(--font-head);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.gift-link{display:inline-flex;align-items:center;gap:3px;max-width:100%;margin-top:6px;padding:1px 7px;border:2px solid var(--ink);border-radius:999px;font-size:var(--text-xs);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)!important;text-decoration:none}
.gift-link svg.icon{width:11px;height:11px}
.gift-price{margin-top:5px;font-size:var(--text-sm);font-weight:700}
.gift-actions{display:flex;justify-content:flex-end;gap:var(--nested-control-gap);padding:4px 8px 10px}
.gift-actions .btn{padding:0 10px;font-size:var(--text-md);box-shadow:var(--elevation-compact)}
.scrim{position:absolute;inset:0;z-index:20;background:rgb(8 12 20 / 55%)}

/* ── Toast inside the phone: top edge so the keyboard never hides it ── */
[data-kb-scroller],[data-thread]{overflow-anchor:none}
.toast{position:absolute;left:50%;top:10px;z-index:60;max-width:calc(100% - 24px);transform:translateX(-50%);padding:9px 14px;border:2px solid var(--ink);border-radius:var(--radius-btn);background:var(--ink);color:var(--card);font-weight:600;font-size:var(--text-md);box-shadow:4px 4px 0 rgb(0 0 0 / 25%)}

/* ══ Component: keyboard-aware assistant sheet ══ */
.assistant{position:absolute;left:0;right:0;bottom:0;z-index:30;height:var(--sheet-height);display:flex;flex-direction:column;min-height:0;background:var(--card);border-top:2.5px solid var(--ink);border-radius:var(--radius-panel) var(--radius-panel) 0 0;box-shadow:0 -6px 24px var(--soft-shadow-strong);transition:height var(--keyboard-motion)}
.assistant[data-sheet=half]{--sheet-height:61%}
.assistant[data-sheet=full]{--sheet-height:calc(100% - 40px)}
/* Keyboard open: either sheet height grows into all space above the keyboard; a thin peek of the page remains while space allows. */
.viewport[data-kb=open] .assistant{--sheet-height:calc(100% - var(--sheet-peek))}
.viewport{--sheet-peek:10px}
.viewport[data-space=tight]{--sheet-peek:0px}
.grabber{flex:none;display:grid;place-items:center;height:20px;padding:0;border:0;background:transparent;cursor:grab;overflow:hidden;border-radius:var(--radius-panel) var(--radius-panel) 0 0;transition:height var(--keyboard-motion)}
.grabber::before{content:"";width:44px;height:5px;border-radius:999px;background:var(--border-strong)}
.viewport[data-kb=open] .grabber{height:0;pointer-events:none}

/* Header: one grid; areas rearrange so the same controls (and the one Bez kontroly switch) move into a single line. */
.as-head{position:relative;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"mark titles titles titles close" "tools tools trust trust trust";align-items:center;gap:6px 8px;padding:0 var(--gutter) 8px;border-bottom:2.5px solid var(--ink);background:var(--card)}
.as-mark{grid-area:mark;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:8px;background:var(--accent-loud);color:var(--accent-loud-foreground);transform:rotate(-4deg)}
.as-titles{grid-area:titles;min-width:0}
.as-title{font:600 var(--text-xl)/1.2 var(--font-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-scope{font-size:var(--text-sm);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-close{grid-area:close;width:40px;height:40px}
.as-tools{grid-area:tools;display:flex;align-items:center;gap:var(--compact-control-gap);margin:0 -4px}
.as-tools .icon-btn{width:40px;height:40px}
.preview-toggle{height:40px!important;padding:0 8px!important}
.trust-row{grid-area:trust;justify-self:end;display:flex;align-items:center;gap:8px;min-height:40px;padding-right:2px;font-size:var(--text-md);white-space:nowrap}
.trust-row label{font-weight:700;cursor:pointer}
.trust-row[data-on=true] label{color:var(--status-success-text)}
.as-more-wrap{grid-area:more;position:relative;display:none}
.viewport[data-kb=open] .as-head{grid-template-areas:"mark titles trust more close";grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:0 4px;min-height:52px;padding:4px 6px 4px var(--gutter)}
.viewport[data-kb=open] .as-mark{width:24px;height:24px;margin-right:4px;border-radius:7px}
.viewport[data-kb=open] .as-mark svg.icon{width:14px;height:14px}
.viewport[data-kb=open] .as-title{font-size:var(--text-lg)}
.viewport[data-kb=open] .as-scope,.viewport[data-kb=open] .as-tools{display:none}
.viewport[data-kb=open] .as-more-wrap{display:block}
.viewport[data-kb=open] .trust-row{gap:6px;padding:0 4px 0 6px;font-size:var(--text-sm);border-radius:var(--radius-btn);background:var(--muted)}
.viewport[data-kb=open] .trust-row[data-on=true]{background:color-mix(in oklab,var(--status-success) 12%,var(--card))}
.as-head.is-reflowing{animation:head-reflow var(--keyboard-motion)}
@keyframes head-reflow{from{opacity:.35;transform:translateY(-3px)}}
.menu{position:absolute;z-index:25;top:calc(100% + 6px);right:-44px;width:236px;padding:6px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:var(--elevation-lifted)}
/* Item corners stay parallel to the menu: 14 - 2.5 - 6 = 5.5 */
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 8px;border:0;border-radius:5.5px;background:transparent;text-align:left;font-weight:600;font-size:var(--text-md);color:var(--foreground)}
.menu-item svg.icon{color:var(--muted-foreground)}
.menu-item:hover,.menu-item:focus-visible{background:var(--accent);outline:none}
.menu-item:focus-visible{box-shadow:inset 0 0 0 2px var(--brand)}
.menu-sub{display:block;font-size:var(--text-xs);font-weight:500;color:var(--muted-foreground)}
.menu-sep{height:2px;margin:5px 2px;background:var(--border)}

.as-thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:12px var(--gutter) 16px;background:var(--background)}
.viewport[data-kb=open] .as-thread{gap:10px;padding:10px var(--gutter) 12px}
.divider{display:flex;align-items:center;gap:10px;font-size:var(--text-xs);font-weight:700;color:var(--muted-foreground)}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--border)}
.msg-user{align-self:flex-end;max-width:88%;display:grid;gap:2px;justify-items:end}
.bubble{padding:7px 11px;border:2px solid var(--ink);border-radius:14px 14px 4px 14px;background:var(--tint);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-meta{font-size:var(--text-xs);color:var(--muted-foreground)}
.msg-ai{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.ai-avatar{width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:7px;background:var(--accent-loud);color:var(--accent-loud-foreground)}
.ai-avatar svg.icon{width:13px;height:13px}
.ai-body{display:grid;gap:8px;min-width:0}
.tools{display:grid;gap:2px;font-size:var(--text-sm);color:var(--muted-foreground)}
.tool{display:flex;align-items:center;gap:6px}
.tool svg.icon{width:13px;height:13px}
.tool[data-state=done] svg.icon{color:var(--status-success-text)}
.tool[data-state=run]{color:var(--foreground);font-weight:600}
.tool[data-state=run] svg.icon{color:var(--brand-link)}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--ink);border-radius:1px}
.spinner{animation:spin .9s linear infinite}
@keyframes spin{to{rotate:360deg}}
@media (prefers-reduced-motion:no-preference){.caret{animation:blink 1s steps(2) infinite}}
@keyframes blink{50%{opacity:0}}
.starters{display:grid;gap:6px}
.starter{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);text-align:left;font-weight:600;box-shadow:var(--elevation-compact)}
.starter:hover:not(:disabled){background:var(--panel-hover)}
.starter:disabled{opacity:.5;cursor:not-allowed}
.starter-icon{width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:8px;background:var(--tint)}
.starter-icon svg.icon{width:14px;height:14px}
/* Starter cards live in the thread only while the keyboard is closed; typing moves them to the chip row. */
.viewport[data-kb=open] .starters{display:none}
.thumb{width:32px;height:32px;flex:none;overflow:hidden;border:2px solid var(--ink);border-radius:8px;background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard{border:2.5px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:var(--elevation-compact);overflow:hidden}
.pcard.is-active{outline:3px solid var(--brand);outline-offset:2px}
/* Band corners: outer radius minus border, no inset. */
.pcard-band{display:flex;align-items:center;gap:6px;min-height:36px;padding:5px 10px;border-bottom:2px solid var(--ink);border-radius:11.5px 11.5px 0 0;background:color-mix(in oklab,var(--ink) 7%,var(--card))}
.pcard-title{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font:600 var(--text-base)/1.25 var(--font-head)}
.pcard-title svg.icon{color:var(--muted-foreground)}
.pcard-body{display:grid;gap:8px;padding:8px 10px 10px}
.pcard-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:var(--text-sm);color:var(--muted-foreground)}
.pcard-meta span{display:inline-flex;align-items:center;gap:4px}
.pcard-meta svg.icon{width:12px;height:12px}
.sum-list{display:grid;gap:6px}
.sum-row{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;font-size:var(--text-md)}
.sum-name{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-sub{display:block;font-size:var(--text-sm);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-row.is-rejected .sum-name{text-decoration:line-through;color:var(--muted-foreground)}

.as-foot{flex:none;display:grid;gap:8px;padding:8px var(--gutter) calc(10px + env(safe-area-inset-bottom));border-top:2.5px solid var(--ink);background:var(--card)}
/* Safe-area padding only with the keyboard closed; the composer then sits flush on the keyboard. */
.viewport[data-kb=open] .as-foot{gap:6px;padding:6px var(--gutter) 6px}

/* Decision bar: full three-action bar when closed, one-line summary + Použít while typing */
.dbar{display:grid;gap:6px;padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:var(--ghost-tint);box-shadow:var(--elevation-compact)}
.dbar-line{display:flex;align-items:center;gap:6px;min-width:0}
.dbar-count{display:flex;align-items:center;gap:6px;min-width:0;min-height:28px;padding:0;border:0;border-radius:var(--radius-btn);background:none;color:var(--foreground);text-align:left;font-size:var(--text-md);font-weight:700}
.dbar-count svg.icon{width:14px;height:14px;color:var(--brand-link)}
.dbar-count .decided{font-weight:500;color:var(--muted-foreground)}
.dbar-chevron,.dbar-apply-inline{display:none}
.actions3{display:flex;gap:var(--compact-control-gap)}
.actions3 .btn{flex:none;padding:0 10px}
.actions3 .btn.grow{flex:1}
.viewport[data-kb=open] .dbar{gap:6px;padding:4px 4px 4px 8px}
.viewport[data-kb=open] .dbar-count{flex:1;min-height:40px;padding:0 6px 0 2px}
.viewport[data-kb=open] .dbar-count:hover{background:var(--accent)}
.viewport[data-kb=open] .dbar-chevron{display:block;margin-left:auto;transition:rotate .2s ease}
.viewport[data-kb=open] .dbar-count[aria-expanded=true] .dbar-chevron{rotate:180deg}
.viewport[data-kb=open] .dbar-apply-inline{display:inline-flex;flex:none;padding:0 12px}
.viewport[data-kb=open] .dbar .actions3{display:none;padding:0 4px 4px 0}
.viewport[data-kb=open] .dbar[data-expanded=true] .actions3{display:flex;animation:drop-in .18s ease}
.viewport[data-kb=open] .dbar .actions3 .btn{flex:1}
.viewport[data-kb=open] .dbar .actions3 .btn.grow{display:none}
@keyframes drop-in{from{opacity:0;transform:translateY(4px)}}

/* Suggestions: wrapped tray while closed, one horizontally scrolling row directly above the composer while typing */
.chip-row{display:flex;flex-wrap:wrap;gap:var(--nested-control-gap)}
.chip-row[data-closed=hidden]{display:none}
.viewport[data-kb=open] .chip-row{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:2px var(--gutter) 3px;scroll-padding-inline:var(--gutter);scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chip-row::-webkit-scrollbar{display:none}
.as-foot.has-text .chip-row{display:none}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font-weight:600;font-size:var(--text-md);white-space:nowrap;box-shadow:var(--elevation-compact);scroll-snap-align:start}
.chip svg.icon{width:14px;height:14px;color:var(--brand-link)}
.chip:hover{background:var(--panel-hover)}
/* Hit target reaches 40 px without changing the visible chip */
.chip::before{content:"";position:absolute;inset:-3px 0}

.status-line{display:flex;align-items:center;gap:6px;font-size:var(--text-md);font-weight:600}
.status-line svg.icon{width:15px;height:15px;color:var(--muted-foreground)}
/* Composer box: radius 16 - border 2.5 - padding 5 = 8.5, rounded to the 7 px button token. */
.composer-box{display:flex;align-items:flex-end;gap:8px;padding:5px 5px 5px 12px;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background:var(--card)}
.composer-box:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.viewport[data-kb=open] .composer-box[data-focus-target]{outline-offset:2px}
.composer-box textarea{flex:1;min-width:0;min-height:40px;height:40px;padding:10px 0;border:0;background:transparent;resize:none;line-height:20px;font-size:16px;outline:none;overflow-y:hidden;overscroll-behavior:contain}
.composer-box textarea::placeholder{color:var(--muted-foreground)}
.composer-box.is-disabled{border-color:var(--border-strong);background:var(--muted)}
.composer-box.is-disabled textarea{cursor:not-allowed}
.composer-send{width:40px;padding:0;flex:none}
.composer-stop{flex:none}

/* Tight space (≈260 px usable): decorative spacing goes first */
.viewport[data-space=tight] .as-thread{padding:8px var(--gutter) 10px;gap:8px}
.viewport[data-space=tight] .as-foot{gap:5px;padding-block:5px}
.viewport[data-space=tight] .pcard-body{gap:6px}

/* ══ Component: gift editor dialog ══ */
.editor{position:absolute;z-index:30;inset:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background:var(--card);box-shadow:var(--elevation-lifted);transition:inset var(--keyboard-motion),border-radius var(--keyboard-motion)}
/* Keyboard open: the dialog grows to the keyboard top so the body gains every pixel. */
.viewport[data-kb=open] .editor{inset:6px 6px 0;border-bottom-width:0;border-radius:var(--radius-panel) var(--radius-panel) 0 0}
.ed-head{flex:none;min-height:56px;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 20px;border-bottom:2px dashed var(--border-strong)}
.ed-head h2{flex:1;min-width:0;font:600 19px/1.2 var(--font-head);overflow-wrap:anywhere}
.ed-save-inline{display:none}
.viewport[data-kb=open] .ed-head{min-height:52px;padding:6px 8px 6px 16px}
.viewport[data-kb=open] .ed-head h2{font-size:var(--text-xl)}
.viewport[data-kb=open] .ed-save-inline{display:inline-flex;animation:pop-in .2s ease}
@keyframes pop-in{from{opacity:0;transform:scale(.92)}}
.round-close{width:40px;height:40px;border-radius:999px;box-shadow:var(--elevation-compact)}
.ed-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 28px;scroll-padding:12px}
.ed-help{margin-bottom:16px;font-size:var(--text-sm);color:var(--muted-foreground)}
.viewport[data-kb=open] .ed-help{display:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.triple{display:grid;grid-template-columns:.75fr 1.2fr 1fr;gap:8px}
.pair .field+.field,.triple .field+.field{margin-top:0}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px}
.link-row .icon-btn{box-shadow:var(--elevation-compact)}
.section{margin-top:22px;padding-top:18px;border-top:2px dashed var(--border-strong)}
.section h3{font:600 var(--text-xl)/1.3 var(--font-head)}
.section p{margin-top:2px;font-size:var(--text-sm);color:var(--muted-foreground)}
.workshop{margin-top:12px;padding:10px;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background:var(--card);box-shadow:var(--elevation-ordinary)}
.ws-stage{position:relative;aspect-ratio:4/3;overflow:hidden;border:2.5px solid var(--ink);border-radius:var(--radius-btn);background:var(--surface)}
.ws-stage img{width:100%;height:100%;object-fit:cover;display:block}
.ws-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:10px;padding:3px;border-radius:10px;background:var(--accent);box-shadow:var(--elevation-compact)}
.ws-modes button{height:34px;border:2.5px solid transparent;border-radius:var(--radius-btn);background:transparent;font-size:var(--text-sm);font-weight:600}
.ws-modes button[aria-pressed=true]{background:var(--card);border-color:var(--ink)}
.ed-foot-wrap{flex:none;display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--keyboard-motion),opacity var(--keyboard-motion)}
.ed-foot-wrap>div{min-height:0;overflow:hidden}
.ed-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 12px;border-top:2px dashed var(--border-strong);background:var(--card)}
.viewport[data-kb=open] .ed-foot-wrap{grid-template-rows:0fr;opacity:0;visibility:hidden}

/* ══ Component: reserve dialog ══ */
.modal-wrap{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px 12px}
/* Keyboard open: the dialog rises to sit just above the keyboard, actions pinned at its foot. */
.viewport[data-kb=open] .modal-wrap{align-items:flex-end;padding:8px 8px 8px}
.modal{width:100%;max-height:100%;display:flex;flex-direction:column;min-height:0;overflow:hidden;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background:var(--card);box-shadow:var(--elevation-lifted)}
.modal-head{flex:none;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 10px 8px 18px}
.modal-head h2{flex:1;font:600 var(--text-2xl)/1.2 var(--font-head)}
.viewport[data-kb=open] .modal-head{min-height:48px;padding:4px 6px 4px 14px;border-bottom:2px dashed var(--border-strong)}
.viewport[data-kb=open] .modal-head h2{font-size:var(--text-xl)}
.modal-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 4px}
.viewport[data-kb=open] .modal-body{padding:10px 14px 8px}
.modal-gift{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border:2px solid var(--ink);border-radius:12px;background:var(--muted)}
.modal-gift .thumb{width:48px;height:48px;border-radius:9px}
.modal-gift strong{display:block;font-size:var(--text-base)}
.modal-gift span{font-size:var(--text-sm);color:var(--muted-foreground)}
.modal-gift{margin-bottom:14px}
.modal-auth{margin-top:14px;font-size:var(--text-sm);color:var(--muted-foreground)}
.modal-auth-links{display:flex;align-items:center;gap:8px;margin-top:2px;font-weight:600}
.modal-auth-links span{font-weight:400}
.viewport[data-kb=open] .modal-auth{display:none}
.viewport[data-kb=open] .modal-gift{grid-template-columns:32px minmax(0,1fr);padding:5px 8px;margin-bottom:12px}
.viewport[data-kb=open] .modal-gift .thumb{width:32px;height:32px;border-radius:8px}
.modal-actions{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.viewport[data-kb=open] .modal-actions{padding:8px 10px 10px;border-top:2px dashed var(--border-strong)}
.viewport[data-kb=open] .modal-actions .btn{flex:1}

/* ══ Component: sign-in page ══ */
.signin{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--background)}
.signin-inner{display:grid;gap:14px;padding:14px var(--gutter) 28px}
.brand{position:relative;display:grid;align-content:end;min-height:200px;overflow:hidden;padding:14px;border:2.5px solid var(--ink);border-radius:var(--radius-panel);background:var(--brand-deep);color:#fff;box-shadow:var(--elevation-ordinary);transition:min-height var(--keyboard-motion),padding var(--keyboard-motion)}
.brand img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity var(--keyboard-motion)}
.brand::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgb(10 30 55 / 82%))}
.brand-text{position:relative;z-index:1}
.brand .logo{color:#fff}
.brand .logo-tld{opacity:.7}
.brand-tagline{margin-top:6px;font:600 var(--text-2xl)/1.2 var(--font-head)}

.viewport[data-kb=open] .brand{min-height:52px;padding:10px 12px}

.pw-wrap{position:relative}

.pw-toggle{position:absolute;right:2px;top:2px;width:36px;height:36px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:var(--ink)}
.forgot{justify-self:end;margin-top:6px}
.auth-submit{margin-top:14px}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:var(--text-xs);font-weight:700;color:var(--muted-foreground)}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--border)}
.auth-foot{margin-top:12px;text-align:center;font-size:var(--text-md)}

const readParams=()=>{
  const params=new URLSearchParams(location.search);
  if(SCENARIOS[params.get('scenario')])state.scenario=params.get('scenario');
  if(['closed','260','336','420'].includes(params.get('kb')))state.kb=params.get('kb');
  if(['light','dark'].includes(params.get('theme')))state.theme=params.get('theme');
  else if(matchMedia('(prefers-color-scheme: dark)').matches)state.theme='dark';
  if(['ready','streaming','cap'].includes(params.get('composer')))state.composer=params.get('composer');
  if(state.kb!=='closed')state.lastOpenKb=state.kb;
};
const writeParams=()=>{
  const params=new URLSearchParams({scenario:state.scenario,kb:state.kb,theme:state.theme});
  if(SCENARIOS[state.scenario].kind==='chat'&&state.composer!=='ready')params.set('composer',state.composer);
  history.replaceState(null,'',`${location.pathname}?${params}`);
};

/* ── Simulated keyboard (Gboard-like, decorative) ── */
function keyboardHtml(height){
  const config=SCENARIOS[state.scenario];
  const row=(keys,extra='')=>`<div class="kb-row ${extra}">${keys.map(key=>`<span class="kb-key ${key.cls||''}">${key.label??key}</span>`).join('')}</div>`;
  const letters=list=>list.split(' ');
  const rows=[];
  if(height>=336)rows.push(row(letters('1 2 3 4 5 6 7 8 9 0').map(label=>({label,cls:'num'}))));
  rows.push(row(letters('q w e r t z u i o p')));
  rows.push(row(letters('a s d f g h j k l'),'indent'));
  rows.push(row([{label:'⇧',cls:'fn'},...letters('y x c v b n m'),{label:'⌫',cls:'fn'}]));
  rows.push(row([{label:'?123',cls:'fn'},',',{label:icon('smile'),cls:''},{label:'Čeština',cls:'space'},'.',{label:config.enter,cls:'enter'}]));
  const suggest=config.suggest
    ?`<div class="kb-suggest"><span>${config.suggest[1]}</span><span class="main">${config.suggest[0]}</span><span>${config.suggest[2]}</span></div>`
    :`<div class="kb-suggest single"><span class="pw">${icon('key')}Uložená hesla</span></div>`;
  const tools=height>=420?`<div class="kb-tools">${icon('grid')}${icon('clipboard')}${icon('smile')}${icon('translate')}${icon('settings')}${icon('mic')}</div>`:'';
  return `${tools}${suggest}<div class="kb-rows">${rows.join('')}</div>`;
}

function afterRender(){

    thread.scrollTop=state.scenario==='chat-empty'?0:thread.scrollHeight;
    layout.threadAtBottom=state.scenario!=='chat-empty';

function syncComposerText(){
  const composer=$('#composer'),foot=$('#as-foot');
  if(composer&&foot)foot.classList.toggle('has-text',composer.value.trim().length>0);
}
/* Growth cap follows the measured space above the keyboard, not a fixed keyboard offset. */
function composerCapFor(usableHeight,open){
  if(!open)return 6;
  if(usableHeight>=400)return 4;
  if(usableHeight>=320)return 3;
  return 2;
}
function sizeComposer(){
  const composer=$('#composer');if(!composer)return;
  const lineHeight=20,verticalPadding=20;
  const max=layout.composerCap*lineHeight+verticalPadding;
  composer.style.height='auto';
  const natural=composer.scrollHeight;
  composer.style.height=`${Math.max(40,Math.min(natural,max))}px`;
  composer.style.overflowY=natural>max?'auto':'hidden';
  if(state.scenario==='chat-long')composer.scrollTop=composer.scrollHeight;
}

/* ── Keyboard state and measured layout ── */
function applyKeyboard({animate}){
  const height=state.kb==='closed'?0:Number(state.kb);
  keyboard.classList.toggle('no-motion',!animate);
  if(height){
    keyboard.style.setProperty('--keyboard-inner',`${height}px`);
    $('#kb-inner').innerHTML=keyboardHtml(height);
  }
  keyboard.style.setProperty('--keyboard-height',`${height}px`);
  phone.dataset.kb=height?'open':'closed';
}
function ensureVisible(scroller,first,last,padding=10){
  const scrollerTop=scroller.getBoundingClientRect().top;
  const top=first.getBoundingClientRect().top-scrollerTop+scroller.scrollTop;
  const bottom=last.getBoundingClientRect().bottom-scrollerTop+scroller.scrollTop;
  /* Deterministic target: the focused field and its action end just above the keyboard, with as much context above as fits. */
  scroller.scrollTop=bottom-top+padding*2>scroller.clientHeight?top-padding:bottom+padding-scroller.clientHeight;
}
function onKeyboardToggle(open){
  const scrollers=document.querySelectorAll('[data-kb-scroller]');
  /* Save before compact chrome hides anything, so the closed layout returns exactly. */
  if(open)scrollers.forEach(scroller=>{layout.savedScroll[scroller.id]=scroller.scrollTop});
  viewport.dataset.kb=open?'open':'closed';
  const head=$('#as-head');
  if(head&&layout.open!==null){head.classList.remove('is-reflowing');void head.offsetWidth;head.classList.add('is-reflowing')}
  const count=$('#dbar-count');
  if(count){
    if(open){count.setAttribute('aria-expanded',String(state.dbarExpanded));count.title='Zobrazit Zamítnout vše a Přijmout vše'}
    else{count.removeAttribute('aria-expanded');count.title='Ukázat návrh v konverzaci'}
  }
  if(!open&&state.menuOpen)setMenu(false);
  if(!open)scrollers.forEach(scroller=>{if(layout.savedScroll[scroller.id]!=null)scroller.scrollTop=layout.savedScroll[scroller.id]});
  layout.open=open;
}
function onViewportResize(){
  const usableHeight=viewport.clientHeight;
  const keyboardHeight=keyboard.getBoundingClientRect().height;
  const open=keyboardHeight>60;
  if(open!==layout.open)onKeyboardToggle(open);
  viewport.dataset.space=usableHeight>=560?'roomy':usableHeight>=330?'snug':'tight';
  layout.composerCap=composerCapFor(usableHeight,open);
  sizeComposer();
  const thread=$('#as-thread');
  if(thread&&layout.threadAtBottom)thread.scrollTop=thread.scrollHeight;
  if(open){
    const scroller=document.querySelector('[data-kb-scroller]');
    const first=$('#focus-start'),last=$('#focus-end')||document.querySelector('[data-focus-target]');
    if(scroller&&first&&last&&scroller.contains(last))ensureVisible(scroller,first,last);
    else if(scroller&&first)ensureVisible(scroller,first,first);
  }
  $('#readout').innerHTML=`Nad klávesnicí: <strong>${Math.round(usableHeight)} px</strong><br>Klávesnice: <strong>${Math.round(keyboardHeight)} px</strong><br>Strop pole: <strong>${layout.composerCap} ř.</strong>`;
}
new ResizeObserver(onViewportResize).observe(viewport);
/* Compressing chrome (brand panel, editor footer) changes content height without resizing the viewport. */
viewport.addEventListener('transitionend',event=>{if(event.target.matches('.brand,.ed-foot-wrap,.editor'))onViewportResize()});

/* ── Interactions ── */
let toastTimer;
function showToast(message){
  const toast=$('#toast');if(!toast)return;
  toast.textContent=message;toast.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true},2200);
}
function setMenu(open,{focusFirst}={}){
  state.menuOpen=open;
  const menu=$('#as-menu'),trigger=$('#as-more');if(!menu)return;
  menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open));
  if(open&&focusFirst)menu.querySelector('.menu-item').focus();
}
function setKeyboard(value){
  if(value!=='closed')state.lastOpenKb=value;
  state.kb=value;
  applyKeyboard({animate:true});
  document.querySelectorAll('[data-set=kb]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===value)));
  writeParams();
}
function setDecision(decision){
  state.decision=decision;
  const expanded=state.dbarExpanded;
  const thread=$('#as-thread'),scroll=thread.scrollTop;
  $('#as-thread').innerHTML=threadHtml();
  $('#as-foot').innerHTML=decisionBarHtml()+chipRowHtml()+composerHtml();
  afterRender();thread.scrollTop=scroll;
  state.dbarExpanded=expanded;
  onKeyboardToggle(layout.open);onViewportResize();
}

document.querySelector('.review-bar').addEventListener('click',event=>{
  const button=event.target.closest('[data-set]');if(!button)return;
  const key=button.dataset.set,value=button.dataset.value;
  if(key==='kb'){setKeyboard(value);return}
  state[key]=value;
  if(key==='composer'){state.dbarExpanded=false;state.menuOpen=false}
  render();
});
$('#scenario-select').addEventListener('change',event=>{
  state.scenario=event.target.value;state.sheetOverride=null;state.trust=false;state.decision='accepted';state.dbarExpanded=false;state.menuOpen=false;
  if(SCENARIOS[state.scenario].kind!=='chat')state.composer='ready';
  render();
});
$('#hide-kb').addEventListener('click',()=>setKeyboard('closed'));

/* Controls that act while typing keep focus in the input, so the keyboard stays open. */
viewport.addEventListener('pointerdown',event=>{if(event.target.closest('[data-keep-focus]'))event.preventDefault()});
viewport.addEventListener('focusin',event=>{
  if(state.kb==='closed'&&event.target.matches('input:not([type=range]),textarea')&&!event.target.disabled)setKeyboard(state.lastOpenKb);
});
viewport.addEventListener('click',event=>{
  const chip=event.target.closest('[data-chip]');
  if(chip){const composer=$('#composer');composer.value=chip.dataset.chip;syncComposerText();sizeComposer();composer.focus();return}
  const target=event.target.closest('[data-act]');
  if(!target){if(state.menuOpen&&!event.target.closest('.as-more-wrap'))setMenu(false);return}
  const action=target.dataset.act;
  switch(action){
    case 'menu':setMenu(!state.menuOpen,{focusFirst:event.detail===0});break;
    case 'preview':setMenu(false);state.sheetOverride='half';setKeyboard('closed');render();break;
    case 'sheet-toggle':state.sheetOverride=state.sheet==='half'?'full':'half';render();break;
    case 'history':setMenu(false);showToast('Otevře se historie konverzací.');break;
    case 'new-chat':setMenu(false);showToast('Začne nová konverzace.');break;
    case 'trust':state.trust=!state.trust;render();break;
    case 'close':showToast('V ukázce zůstává okno otevřené.');break;
    case 'save':showToast('Dárek uložen.');break;
    case 'reserve':showToast('Dárek je rezervovaný.');break;
    case 'stop':showToast('Zastaveno. Nic se nezměnilo.');break;
    case 'apply':showToast('Použito · 3 dárky');break;
    case 'decline':showToast('Návrh zamítnut.');break;
    case 'reject-all':setDecision('rejected');break;
    case 'accept-all':setDecision('accepted');break;
  }
});
viewport.addEventListener('click',event=>{
  const count=event.target.closest('#dbar-count');if(!count)return;
  if(layout.open){
    state.dbarExpanded=!state.dbarExpanded;
    count.setAttribute('aria-expanded',String(state.dbarExpanded));
    $('#dbar').dataset.expanded=String(state.dbarExpanded);
    onViewportResize();
  }else{
    const card=$('#proposal-card');if(card)card.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
});
viewport.addEventListener('keydown',event=>{
  if(!state.menuOpen)return;
  const items=[...document.querySelectorAll('#as-menu .menu-item')];
  const index=items.indexOf(document.activeElement);
  if(event.key==='Escape'){setMenu(false);$('#as-more').focus();event.preventDefault()}
  else if(event.key==='ArrowDown'){items[(index+1)%items.length].focus();event.preventDefault()}
  else if(event.key==='ArrowUp'){items[(index-1+items.length)%items.length].focus();event.preventDefault()}
});

readParams();
applyKeyboard({animate:false});
render();
requestAnimationFrame(()=>keyboard.classList.remove('no-motion'));
</script>
</body>
</html>
